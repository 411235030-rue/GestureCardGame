<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>手勢抽卡遊戲</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #fff4f7, #f3efff);
      color: #2b2330;
      min-height: 100vh;
      overflow: hidden;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .screen {
      width: 100vw;
      height: 100vh;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 24px;
    }

    .screen.active {
      display: flex;
    }

    #welcomeScreen h1 {
      font-size: clamp(40px, 7vw, 82px);
      margin: 0 0 16px;
    }

    #welcomeScreen p {
      font-size: 18px;
      opacity: 0.7;
      margin: 0 0 28px;
    }

    #startBtn {
      border: 0;
      border-radius: 999px;
      padding: 16px 34px;
      font-size: 20px;
      font-weight: 700;
      background: #2b2330;
      color: white;
      box-shadow: 0 14px 35px rgba(43, 35, 48, 0.18);
      transition: transform 0.2s ease;
    }

    #startBtn:hover {
      transform: translateY(-2px);
    }

    #startBtn:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    #gameScreen {
      position: relative;
    }

    .topbar {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 25px rgba(0,0,0,.07);
      z-index: 5;
      font-size: 14px;
    }

    #cameraDot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #aaa;
    }

    #cameraDot.on {
      background: #2ecc71;
      box-shadow: 0 0 0 5px rgba(46, 204, 113, .14);
    }

    .card-stage {
      width: min(82vw, 420px);
      aspect-ratio: 2.5 / 3.5;
      perspective: 1200px;
      position: relative;
    }

    .card {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transition:
        transform 0.55s cubic-bezier(.2,.8,.2,1),
        opacity 0.35s ease;
      border-radius: 28px;
    }

    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 28px;
      backface-visibility: hidden;
      overflow: hidden;
      box-shadow: 0 30px 70px rgba(63, 45, 68, 0.25);
      border: 8px solid rgba(255,255,255,.85);
    }

    .card-back {
      background:
        radial-gradient(circle at 25% 20%, rgba(255,255,255,.4), transparent 26%),
        linear-gradient(145deg, #7b5cff, #e89ac7);
      display: grid;
      place-items: center;
      color: white;
      text-align: center;
    }

    .card-back span {
      font-size: 72px;
    }

    .card-back small {
      display: block;
      margin-top: 10px;
      font-size: 16px;
      letter-spacing: .16em;
      opacity: .9;
    }

    .card-front {
      transform: rotateY(180deg);
      padding: 28px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      color: white;
    }

    .card-front .number {
      font-size: 14px;
      letter-spacing: .14em;
      opacity: .75;
    }

    .card-front h2 {
      font-size: 42px;
      margin: 8px 0 4px;
    }

    .card-front p {
      margin: 0;
      opacity: .88;
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card.fly-left {
      transform: translateX(-135vw) rotate(-18deg);
      opacity: 0;
    }

    .card.fly-right {
      transform: translateX(135vw) rotate(18deg);
      opacity: 0;
    }

    .hint {
      position: absolute;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%);
      width: min(92vw, 620px);
      text-align: center;
      line-height: 1.7;
      font-size: 14px;
      opacity: .72;
    }

    #gestureStatus {
      font-weight: 800;
      opacity: 1;
    }

    #debugPanel {
      position: fixed;
      right: 14px;
      top: 14px;
      z-index: 9999;
      min-width: 230px;
      background: rgba(0, 0, 0, 0.78);
      color: #fff;
      padding: 12px 14px;
      border-radius: 12px;
      font-family: Consolas, monospace;
      white-space: pre-line;
      font-size: 12px;
      line-height: 1.45;
      pointer-events: none;
    }

    #webcam {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      left: -9999px;
      top: -9999px;
    }

    .error-box {
      max-width: 540px;
      background: rgba(255,255,255,.9);
      padding: 18px 20px;
      border-radius: 18px;
      margin-top: 20px;
      display: none;
      line-height: 1.6;
      text-align: left;
    }

    .front-0 { background: linear-gradient(145deg, #ff8fb2, #8c5fff); }
    .front-1 { background: linear-gradient(145deg, #6ed6d1, #2878c7); }
    .front-2 { background: linear-gradient(145deg, #f6b45f, #e65f87); }
    .front-3 { background: linear-gradient(145deg, #91c96c, #4c8c6c); }
    .front-4 { background: linear-gradient(145deg, #9588ff, #5c4ec7); }

    @media (max-width: 520px) {
      .card-stage {
        width: min(84vw, 360px);
      }

      .card-front h2 {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>
  <section id="welcomeScreen" class="screen active">
    <h1>抽卡時間 ✨</h1>
    <p>用手勢翻牌與切換卡片</p>
    <button id="startBtn">開始玩</button>

    <div id="errorBox" class="error-box"></div>
  </section>

  <section id="gameScreen" class="screen">
    <div class="topbar">
      <span id="cameraDot"></span>
      <span id="cameraText">準備鏡頭中</span>
      <span>・</span>
      <span id="cardCounter">1 / 20</span>
    </div>

    <div class="card-stage">
      <div id="card" class="card">
        <div class="card-face card-back">
          <div>
            <span id="backNumber">1</span>
            <small>CARD</small>
          </div>
        </div>

        <div id="cardFront" class="card-face card-front front-0">
          <div class="number" id="cardNumber">CARD 01</div>
          <h2 id="cardTitle">CARD 1</h2>
          <p id="cardText">第 1 張測試卡</p>
        </div>
      </div>
    </div>

    <div class="hint">
      <div id="gestureStatus">把手放到鏡頭前</div>
      ← 左滑：下一張　　↑ 上滑：翻牌　　→ 右滑：上一張
      <br />
      測試時也可以用鍵盤：A / W / D
    </div>
  </section>

  <div id="debugPanel">Hand: NO
Result: 等待開始</div>

  <video id="webcam" autoplay playsinline muted></video>

  <script type="module">
    import {
      HandLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/+esm";

    const cards = Array.from({ length: 20 }, (_, i) => ({
      title: `CARD ${i + 1}`,
      text: `第 ${i + 1} 張測試卡`,
      className: `front-${i % 5}`
    }));

    const welcomeScreen = document.querySelector("#welcomeScreen");
    const gameScreen = document.querySelector("#gameScreen");
    const startBtn = document.querySelector("#startBtn");
    const webcam = document.querySelector("#webcam");

    const card = document.querySelector("#card");
    const cardFront = document.querySelector("#cardFront");
    const cardTitle = document.querySelector("#cardTitle");
    const cardText = document.querySelector("#cardText");
    const cardNumber = document.querySelector("#cardNumber");
    const backNumber = document.querySelector("#backNumber");
    const cardCounter = document.querySelector("#cardCounter");

    const cameraDot = document.querySelector("#cameraDot");
    const cameraText = document.querySelector("#cameraText");
    const gestureStatus = document.querySelector("#gestureStatus");
    const errorBox = document.querySelector("#errorBox");
    const debugPanel = document.querySelector("#debugPanel");

    let currentIndex = 0;
    const revealed = new Set();
    let isAnimating = false;

    function updateCard() {
      const data = cards[currentIndex];

      cardTitle.textContent = data.title;
      cardText.textContent = data.text;
      backNumber.textContent = currentIndex + 1;
      cardNumber.textContent =
        `CARD ${String(currentIndex + 1).padStart(2, "0")}`;

      cardCounter.textContent =
        `${currentIndex + 1} / ${cards.length}`;

      cardFront.className =
        `card-face card-front ${data.className}`;

      card.className = "card";

      if (revealed.has(currentIndex)) {
        card.classList.add("flipped");
      }
    }

    function flipCard() {
      if (isAnimating) return;
      if (revealed.has(currentIndex)) return;

      revealed.add(currentIndex);
      card.classList.add("flipped");
      gestureStatus.textContent = "↑ 翻牌";
    }

    function nextCard() {
      if (isAnimating) return;

      if (currentIndex >= cards.length - 1) {
        gestureStatus.textContent = "已經是最後一張";
        return;
      }

      isAnimating = true;
      gestureStatus.textContent = "← 下一張";
      card.classList.add("fly-left");

      setTimeout(() => {
        currentIndex++;
        updateCard();
        isAnimating = false;
      }, 360);
    }

    function previousCard() {
      if (isAnimating) return;

      if (currentIndex <= 0) {
        gestureStatus.textContent = "已經是第一張";
        return;
      }

      isAnimating = true;
      gestureStatus.textContent = "→ 上一張";
      card.classList.add("fly-right");

      setTimeout(() => {
        currentIndex--;
        updateCard();
        isAnimating = false;
      }, 360);
    }

    let handLandmarker = null;
    let cameraStream = null;
    let detectionStarted = false;

    let gestureStart = null;
    let lastHandSeenAt = 0;
    let lastGestureAt = 0;
    let lastPosition = null;
    let stableFrameCount = 0;

    const HORIZONTAL_THRESHOLD = 0.24;
    const UP_THRESHOLD = 0.22;
    const GESTURE_WINDOW_MS = 700;
    const GESTURE_COOLDOWN_MS = 1000;
    const MIN_MOVEMENT_SPEED = 0.00032;
    const REQUIRED_STABLE_FRAMES = 3;

    async function createHandLandmarker() {
      cameraText.textContent = "載入手部辨識";

      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm"
      );

      handLandmarker = await HandLandmarker.createFromOptions(
        vision,
        {
          baseOptions: {
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
            delegate: "GPU"
          },
          runningMode: "VIDEO",
          numHands: 1,
          minHandDetectionConfidence: 0.55,
          minHandPresenceConfidence: 0.55,
          minTrackingConfidence: 0.55
        }
      );
    }

    async function startCamera() {
      if (!navigator.mediaDevices?.getUserMedia) {
        throw new Error("這個瀏覽器不支援相機存取。");
      }

      cameraText.textContent = "等待相機權限";

      cameraStream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user",
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      });

      webcam.srcObject = cameraStream;

      await new Promise((resolve) => {
        webcam.onloadedmetadata = resolve;
      });

      await webcam.play();

      cameraDot.classList.add("on");
      cameraText.textContent = "手勢辨識中";
    }

    function getPalmCenter(landmarks) {
      const indices = [0, 5, 9, 13, 17];

      let x = 0;
      let y = 0;

      for (const index of indices) {
        x += landmarks[index].x;
        y += landmarks[index].y;
      }

      x /= indices.length;
      y /= indices.length;

      return {
        x: 1 - x,
        y
      };
    }

    function setDebug(lines) {
      debugPanel.textContent = lines.join("\n");
    }

    function processHandMovement(position, now) {
      lastHandSeenAt = now;

      if (now - lastGestureAt < GESTURE_COOLDOWN_MS) {
        const left = Math.max(0, GESTURE_COOLDOWN_MS - (now - lastGestureAt));
        setDebug([
          "Hand: YES",
          `x: ${position.x.toFixed(3)}  y: ${position.y.toFixed(3)}`,
          "Result: 冷卻中",
          `剩餘: ${Math.ceil(left)} ms`
        ]);
        gestureStart = null;
        lastPosition = position;
        stableFrameCount = 0;
        return;
      }

      if (!lastPosition) {
        lastPosition = position;
        gestureStart = { x: position.x, y: position.y, time: now };
        setDebug([
          "Hand: YES",
          `x: ${position.x.toFixed(3)}  y: ${position.y.toFixed(3)}`,
          "Result: 建立手勢起點"
        ]);
        gestureStatus.textContent = "偵測到手 ✓";
        return;
      }

      const frameDx = position.x - lastPosition.x;
      const frameDy = position.y - lastPosition.y;
      const frameDistance = Math.hypot(frameDx, frameDy);

      if (frameDistance < 0.006) {
        stableFrameCount++;
        if (stableFrameCount >= REQUIRED_STABLE_FRAMES) {
          gestureStart = { x: position.x, y: position.y, time: now };
        }
        setDebug([
          "Hand: YES",
          `x: ${position.x.toFixed(3)}  y: ${position.y.toFixed(3)}`,
          `frame move: ${frameDistance.toFixed(4)}`,
          "Result: 手幾乎沒動"
        ]);
        lastPosition = position;
        return;
      }

      stableFrameCount = 0;

      if (!gestureStart) {
        gestureStart = { x: position.x, y: position.y, time: now };
        lastPosition = position;
        return;
      }

      const elapsed = now - gestureStart.time;
      if (elapsed > GESTURE_WINDOW_MS) {
        setDebug([
          "Hand: YES",
          `x: ${position.x.toFixed(3)}  y: ${position.y.toFixed(3)}`,
          `elapsed: ${Math.round(elapsed)} ms`,
          "Result: 動作太慢，重新取起點"
        ]);
        gestureStart = { x: position.x, y: position.y, time: now };
        lastPosition = position;
        return;
      }

      const dx = position.x - gestureStart.x;
      const dy = position.y - gestureStart.y;
      const absX = Math.abs(dx);
      const absY = Math.abs(dy);
      const distance = Math.hypot(dx, dy);
      const speed = distance / Math.max(elapsed, 1);

      let reason = "距離不足";
      let gesture = null;

      if (speed < MIN_MOVEMENT_SPEED) {
        reason = "速度太慢";
      } else if (dy < -UP_THRESHOLD && absY > absX * 1.45) {
        gesture = "UP";
        reason = "上滑成立";
      } else if (absX > HORIZONTAL_THRESHOLD && absX > absY * 1.45) {
        gesture = dx < 0 ? "LEFT" : "RIGHT";
        reason = gesture === "LEFT" ? "左滑成立" : "右滑成立";
      } else if (absX > HORIZONTAL_THRESHOLD || absY > UP_THRESHOLD) {
        reason = "方向太斜";
      } else if (absX >= absY) {
        reason = `水平距離不足 (${absX.toFixed(3)} / ${HORIZONTAL_THRESHOLD})`;
      } else {
        reason = `上滑距離不足 (${absY.toFixed(3)} / ${UP_THRESHOLD})`;
      }

      setDebug([
        "Hand: YES",
        `x: ${position.x.toFixed(3)}  y: ${position.y.toFixed(3)}`,
        `dx: ${dx.toFixed(3)}  dy: ${dy.toFixed(3)}`,
        `speed: ${speed.toFixed(5)}`,
        `elapsed: ${Math.round(elapsed)} ms`,
        `Result: ${gesture ? "✓" : "✗"} ${reason}`
      ]);

      if (!gesture) {
        lastPosition = position;
        return;
      }

      lastGestureAt = now;
      gestureStart = null;
      lastPosition = null;
      stableFrameCount = 0;

      if (gesture === "LEFT") nextCard();
      if (gesture === "RIGHT") previousCard();
      if (gesture === "UP") flipCard();
    }

    function detectLoop() {
      if (!detectionStarted || !handLandmarker) return;

      const now = performance.now();

      if (webcam.readyState >= 2) {
        const result = handLandmarker.detectForVideo(
          webcam,
          now
        );

        if (result.landmarks?.length > 0) {
          const hand = result.landmarks[0];
          const position = getPalmCenter(hand);
          processHandMovement(position, now);
        } else {
          if (now - lastHandSeenAt > 250) {
            gestureStart = null;
            lastPosition = null;
            stableFrameCount = 0;
            gestureStatus.textContent = "把手放到鏡頭前";
            setDebug(["Hand: NO", "Result: 沒偵測到手"]);
          }
        }
      }

      requestAnimationFrame(detectLoop);
    }

    async function startGame() {
      startBtn.disabled = true;
      startBtn.textContent = "準備中…";
      errorBox.style.display = "none";

      try {
        if (!handLandmarker) {
          await createHandLandmarker();
        }

        await startCamera();

        welcomeScreen.classList.remove("active");
        gameScreen.classList.add("active");

        updateCard();

        detectionStarted = true;
        requestAnimationFrame(detectLoop);
      } catch (error) {
        console.error(error);

        startBtn.disabled = false;
        startBtn.textContent = "重新嘗試";

        errorBox.style.display = "block";
        errorBox.innerHTML = `
          <strong>無法啟動鏡頭或手勢辨識。</strong><br>
          ${error.message}<br><br>
          請確認：<br>
          1. 已允許瀏覽器使用相機<br>
          2. 使用 localhost 或 HTTPS 開啟網站
        `;
      }
    }

    startBtn.addEventListener("click", startGame);

    window.addEventListener("keydown", (event) => {
      if (!gameScreen.classList.contains("active")) return;

      const key = event.key.toLowerCase();

      if (key === "a" || event.key === "ArrowLeft") {
        nextCard();
      }

      if (key === "d" || event.key === "ArrowRight") {
        previousCard();
      }

      if (key === "w" || event.key === "ArrowUp") {
        flipCard();
      }
    });
  </script>
</body>
</html>
