<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>手勢抽卡遊戲</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #fff4f7, #f3efff);
      color: #2b2330;
      min-height: 100vh;
      overflow: hidden;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .screen {
      width: 100vw;
      height: 100vh;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 24px;
    }

    .screen.active {
      display: flex;
    }

    /* 歡迎畫面 */
    #welcomeScreen h1 {
      font-size: clamp(40px, 7vw, 82px);
      margin: 0 0 16px;
    }

    #welcomeScreen p {
      font-size: 18px;
      opacity: 0.7;
      margin: 0 0 28px;
    }

    #startBtn {
      border: 0;
      border-radius: 999px;
      padding: 16px 34px;
      font-size: 20px;
      font-weight: 700;
      background: #2b2330;
      color: white;
      box-shadow: 0 14px 35px rgba(43, 35, 48, 0.18);
      transition: transform 0.2s ease;
    }

    #startBtn:hover {
      transform: translateY(-2px);
    }

    #startBtn:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    /* 遊戲畫面 */
    #gameScreen {
      position: relative;
    }

    .topbar {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 25px rgba(0,0,0,.07);
      z-index: 5;
      font-size: 14px;
    }

    #cameraDot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #aaa;
    }

    #cameraDot.on {
      background: #2ecc71;
      box-shadow: 0 0 0 5px rgba(46, 204, 113, .14);
    }

    .card-stage {
      width: min(82vw, 420px);
      aspect-ratio: 2.5 / 3.5;
      perspective: 1200px;
      position: relative;
    }

    .card {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transition:
        transform 0.55s cubic-bezier(.2,.8,.2,1),
        opacity 0.35s ease;
      border-radius: 28px;
    }

    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 28px;
      backface-visibility: hidden;
      overflow: hidden;
      box-shadow: 0 30px 70px rgba(63, 45, 68, 0.25);
      border: 8px solid rgba(255,255,255,.85);
    }

    .card-back {
      background:
        radial-gradient(circle at 25% 20%, rgba(255,255,255,.4), transparent 26%),
        linear-gradient(145deg, #7b5cff, #e89ac7);
      display: grid;
      place-items: center;
      color: white;
      text-align: center;
    }

    .card-back span {
      font-size: 72px;
    }

    .card-back small {
      display: block;
      margin-top: 10px;
      font-size: 16px;
      letter-spacing: .16em;
      opacity: .9;
    }

    .card-front {
      transform: rotateY(180deg);
      padding: 0;
      background: #111;
      display: block;
    }

    .card-front img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #111;
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card.fly-left {
      transform: translateX(-135vw) rotate(-18deg);
      opacity: 0;
    }

    .card.fly-right {
      transform: translateX(135vw) rotate(18deg);
      opacity: 0;
    }

    .hint {
      position: absolute;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%);
      width: min(92vw, 620px);
      text-align: center;
      line-height: 1.7;
      font-size: 14px;
      opacity: .72;
    }

    #gestureStatus {
      font-weight: 800;
      opacity: 1;
    }

    #debugPanel {
      position: fixed;
      right: 14px;
      top: 14px;
      z-index: 9999;
      min-width: 230px;
      background: rgba(0, 0, 0, 0.78);
      color: #fff;
      padding: 12px 14px;
      border-radius: 12px;
      font-family: Consolas, monospace;
      white-space: pre-line;
      font-size: 12px;
      line-height: 1.45;
      pointer-events: none;
    }

    /* 鏡頭存在，但使用者看不到 */
    #webcam {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      left: -9999px;
      top: -9999px;
    }

    .error-box {
      max-width: 540px;
      background: rgba(255,255,255,.9);
      padding: 18px 20px;
      border-radius: 18px;
      margin-top: 20px;
      display: none;
      line-height: 1.6;
      text-align: left;
    }

    @media (max-width: 520px) {
      .card-stage {
        width: min(84vw, 360px);
      }

    }
  </style>
</head>

<body>
  <section id="welcomeScreen" class="screen active">
    <h1>抽卡時間 ✨</h1>
    <p>用手勢翻牌與切換卡片</p>
    <button id="startBtn">開始玩</button>

    <div id="errorBox" class="error-box"></div>
  </section>

  <section id="gameScreen" class="screen">
    <div class="topbar">
      <span id="cameraDot"></span>
      <span id="cameraText">準備鏡頭中</span>
      <span>・</span>
      <span id="cardCounter">1 / 20</span>
    </div>

    <div class="card-stage">
      <div id="card" class="card">
        <div class="card-face card-back">
          <div>
            <span id="backNumber">1</span>
            <small>CARD</small>
          </div>
        </div>

        <div id="cardFront" class="card-face card-front">
          <img id="cardImage" src="card/card1.jpeg" alt="CARD 01" />
        </div>
      </div>
    </div>

    <div class="hint">
      <div id="gestureStatus">把手放到鏡頭前</div>
      ← 左滑：下一張　　↑ 上滑：翻牌　　→ 右滑：上一張
      <br />
      測試時也可以用鍵盤：A / W / D
    </div>
  </section>

  <div id="debugPanel">Hand: NO\nResult: 等待開始</div>

  <video id="webcam" autoplay playsinline muted></video>

  <script type="module">
    import {
      HandLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/+esm";

    // ==========================================
    // 1. 固定測試卡
    // 之後你只要把這裡換成真正卡片資料 / 圖片即可
    // ==========================================
    const cards = Array.from({ length: 20 }, (_, i) => ({
      image: `card/card${i + 1}.jpeg`
    }));

    // 預先載入 20 張卡片，翻牌時比較順
    cards.forEach((data) => {
      const image = new Image();
      image.src = data.image;
    });

    // ==========================================
    // 2. DOM
    // ==========================================
    const welcomeScreen = document.querySelector("#welcomeScreen");
    const gameScreen = document.querySelector("#gameScreen");
    const startBtn = document.querySelector("#startBtn");
    const webcam = document.querySelector("#webcam");

    const card = document.querySelector("#card");
    const cardFront = document.querySelector("#cardFront");
    const cardImage = document.querySelector("#cardImage");
    const backNumber = document.querySelector("#backNumber");
    const cardCounter = document.querySelector("#cardCounter");

    const cameraDot = document.querySelector("#cameraDot");
    const cameraText = document.querySelector("#cameraText");
    const gestureStatus = document.querySelector("#gestureStatus");
    const errorBox = document.querySelector("#errorBox");
    const debugPanel = document.querySelector("#debugPanel");

    // ==========================================
    // 3. 遊戲狀態
    // ==========================================
    let currentIndex = 0;

    // 哪些卡已經翻開過
    // 依照目前需求：翻開後不能再翻回去
    const revealed = new Set();

    let isAnimating = false;

    function updateCard() {
      const data = cards[currentIndex];

      backNumber.textContent = currentIndex + 1;
      cardCounter.textContent =
        `${currentIndex + 1} / ${cards.length}`;

      cardImage.src = data.image;
      cardImage.alt =
        `CARD ${String(currentIndex + 1).padStart(2, "0")}`;

      cardFront.className = "card-face card-front";
      card.className = "card";

      if (revealed.has(currentIndex)) {
        card.classList.add("flipped");
      }
    }

    function flipCard() {
      if (isAnimating) return;
      if (revealed.has(currentIndex)) return;

      revealed.add(currentIndex);
      card.classList.add("flipped");

      gestureStatus.textContent = "↑ 翻牌";
    }

    function nextCard() {
      if (isAnimating) return;

      // 已經最後一張就不再往後
      if (currentIndex >= cards.length - 1) {
        gestureStatus.textContent = "已經是最後一張";
        return;
      }

      isAnimating = true;
      gestureStatus.textContent = "← 下一張";
      card.classList.add("fly-left");

      setTimeout(() => {
        currentIndex++;
        updateCard();
        isAnimating = false;
      }, 360);
    }

    function previousCard() {
      if (isAnimating) return;

      // 已經第一張就不再往前
      if (currentIndex <= 0) {
        gestureStatus.textContent = "已經是第一張";
        return;
      }

      isAnimating = true;
      gestureStatus.textContent = "→ 上一張";
      card.classList.add("fly-right");

      setTimeout(() => {
        currentIndex--;
        updateCard();
        isAnimating = false;
      }, 360);
    }

    // ==========================================
    // 4. MediaPipe 手部辨識
    // ==========================================
    let handLandmarker = null;
    let cameraStream = null;
    let detectionStarted = false;

    // 手勢追蹤
    let gestureStart = null;
    let lastHandSeenAt = 0;
    let lastGestureAt = 0;
    let lastPosition = null;

    // 手勢門檻：左右保持靈敏；上滑需要更明顯位移，避免輕微往上就翻牌
    const HORIZONTAL_THRESHOLD = 0.12;
    const UP_THRESHOLD = 0.2;
    const GESTURE_WINDOW_MS = 1200;
    const GESTURE_COOLDOWN_MS = 700;
    const MIN_MOVEMENT_SPEED = 0.00010;
    const DIRECTION_RATIO = 1.15;

    // 偵錯面板只更新 4 次/秒，不要每一幀狂跳
    const DEBUG_INTERVAL_MS = 250;
    let lastDebugAt = 0;
    let lastDebugLines = ["Hand: NO", "Result: 等待開始"];

    async function createHandLandmarker() {
      cameraText.textContent = "載入手部辨識";

      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm"
      );

      handLandmarker = await HandLandmarker.createFromOptions(
        vision,
        {
          baseOptions: {
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
            delegate: "GPU"
          },
          runningMode: "VIDEO",
          numHands: 1,
          minHandDetectionConfidence: 0.55,
          minHandPresenceConfidence: 0.55,
          minTrackingConfidence: 0.55
        }
      );
    }

    async function startCamera() {
      if (!navigator.mediaDevices?.getUserMedia) {
        throw new Error("這個瀏覽器不支援相機存取。");
      }

      cameraText.textContent = "等待相機權限";

      cameraStream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user",
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      });

      webcam.srcObject = cameraStream;

      await new Promise((resolve) => {
        webcam.onloadedmetadata = resolve;
      });

      await webcam.play();

      cameraDot.classList.add("on");
      cameraText.textContent = "手勢辨識中";
    }

    // 取手掌中心，會比只追某一根手指穩
    function getPalmCenter(landmarks) {
      const indices = [0, 5, 9, 13, 17];

      let x = 0;
      let y = 0;

      for (const index of indices) {
        x += landmarks[index].x;
        y += landmarks[index].y;
      }

      x /= indices.length;
      y /= indices.length;

      // 自拍鏡頭以「鏡子」直覺操作
      // 所以 X 軸反轉
      return {
        x: 1 - x,
        y
      };
    }

    function resetGestureTracking(position = null, now = performance.now()) {
      gestureStart = position
        ? {
            x: position.x,
            y: position.y,
            time: now
          }
        : null;
    }

    function setDebug(lines, now = performance.now(), force = false) {
      lastDebugLines = lines;
      if (!force && now - lastDebugAt < DEBUG_INTERVAL_MS) return;
      lastDebugAt = now;
      debugPanel.textContent = lines.join("\n");
    }

    function processHandMovement(position, now) {
      lastHandSeenAt = now;

      // 一次手勢完成後短暫冷卻，避免同一個揮動重複觸發
      if (now - lastGestureAt < GESTURE_COOLDOWN_MS) {
        const left = Math.max(0, GESTURE_COOLDOWN_MS - (now - lastGestureAt));
        setDebug([
          "Hand: YES",
          `x: ${position.x.toFixed(3)}  y: ${position.y.toFixed(3)}`,
          "Result: 冷卻中",
          `剩餘: ${Math.ceil(left)} ms`
        ], now);
        return;
      }

      // 第一次看到手：只建立起點，不立即判斷
      if (!gestureStart) {
        gestureStart = { x: position.x, y: position.y, time: now };
        lastPosition = position;
        gestureStatus.textContent = "偵測到手 ✓";
        setDebug([
          "Hand: YES",
          `x: ${position.x.toFixed(3)}  y: ${position.y.toFixed(3)}`,
          "Result: 已建立起點，開始揮動"
        ], now, true);
        return;
      }

      const elapsed = now - gestureStart.time;

      // 超過時間仍沒有完成手勢，就把目前位置當新起點
      if (elapsed > GESTURE_WINDOW_MS) {
        gestureStart = { x: position.x, y: position.y, time: now };
        lastPosition = position;
        setDebug([
          "Hand: YES",
          `x: ${position.x.toFixed(3)}  y: ${position.y.toFixed(3)}`,
          "Result: 動作時間超過 1.2 秒，重新取起點"
        ], now, true);
        return;
      }

      const dx = position.x - gestureStart.x;
      const dy = position.y - gestureStart.y;
      const absX = Math.abs(dx);
      const absY = Math.abs(dy);
      const distance = Math.hypot(dx, dy);
      const speed = distance / Math.max(elapsed, 1);

      let reason = "繼續移動";
      let gesture = null;

      // 上滑：往上移動距離足夠，而且垂直位移要略大於水平位移
      if (dy < -UP_THRESHOLD && absY > absX * DIRECTION_RATIO) {
        gesture = "UP";
        reason = "上滑成立";
      }
      // 左右滑：水平移動距離足夠，而且水平位移要略大於垂直位移
      else if (absX > HORIZONTAL_THRESHOLD && absX > absY * DIRECTION_RATIO) {
        gesture = dx < 0 ? "LEFT" : "RIGHT";
        reason = gesture === "LEFT" ? "左滑成立" : "右滑成立";
      }
      // 速度太慢只做提示，不直接丟掉整段軌跡
      else if (speed < MIN_MOVEMENT_SPEED && elapsed > 300) {
        reason = "移動偏慢，但仍在等待距離";
      }
      else if (absX >= absY) {
        reason = `水平進度 ${Math.min(100, Math.round(absX / HORIZONTAL_THRESHOLD * 100))}%`;
      }
      else if (dy < 0) {
        reason = `上滑進度 ${Math.min(100, Math.round(absY / UP_THRESHOLD * 100))}%`;
      }
      else {
        reason = "目前是往下移動，不觸發";
      }

      setDebug([
        "Hand: YES",
        `x: ${position.x.toFixed(3)}  y: ${position.y.toFixed(3)}`,
        `dx: ${dx.toFixed(3)}  dy: ${dy.toFixed(3)}`,
        `speed: ${speed.toFixed(5)}`,
        `elapsed: ${Math.round(elapsed)} ms`,
        `Result: ${gesture ? "✓" : "·"} ${reason}`
      ], now, Boolean(gesture));

      lastPosition = position;

      if (!gesture) return;

      lastGestureAt = now;
      gestureStart = null;
      lastPosition = null;

      if (gesture === "LEFT") nextCard();
      if (gesture === "RIGHT") previousCard();
      if (gesture === "UP") flipCard();
    }

    function detectLoop() {
      if (!detectionStarted || !handLandmarker) return;

      const now = performance.now();

      if (webcam.readyState >= 2) {
        const result = handLandmarker.detectForVideo(
          webcam,
          now
        );

        if (result.landmarks?.length > 0) {
          const hand = result.landmarks[0];
          const position = getPalmCenter(hand);
          processHandMovement(position, now);
        } else {
          // 手離開畫面一小段時間就重設起點
          if (now - lastHandSeenAt > 250) {
            gestureStart = null;
            lastPosition = null;
            gestureStatus.textContent = "把手放到鏡頭前";
            setDebug(["Hand: NO", "Result: 沒偵測到手"], now, true);
          }
        }
      }

      requestAnimationFrame(detectLoop);
    }

    // ==========================================
    // 5. 開始遊戲
    // ==========================================
    async function startGame() {
      startBtn.disabled = true;
      startBtn.textContent = "準備中…";
      errorBox.style.display = "none";

      try {
        if (!handLandmarker) {
          await createHandLandmarker();
        }

        await startCamera();

        welcomeScreen.classList.remove("active");
        gameScreen.classList.add("active");

        updateCard();

        detectionStarted = true;
        requestAnimationFrame(detectLoop);
      } catch (error) {
        console.error(error);

        startBtn.disabled = false;
        startBtn.textContent = "重新嘗試";

        errorBox.style.display = "block";
        errorBox.innerHTML = `
          <strong>無法啟動鏡頭或手勢辨識。</strong><br>
          ${error.message}<br><br>
          請確認：<br>
          1. 已允許瀏覽器使用相機<br>
          2. 使用 localhost 或 HTTPS 開啟網站
        `;
      }
    }

    startBtn.addEventListener("click", startGame);

    // ==========================================
    // 6. 鍵盤測試
    // 沒鏡頭時可以先測遊戲流程
    // ==========================================
    window.addEventListener("keydown", (event) => {
      if (!gameScreen.classList.contains("active")) return;

      const key = event.key.toLowerCase();

      if (key === "a" || event.key === "ArrowLeft") {
        nextCard();
      }

      if (key === "d" || event.key === "ArrowRight") {
        previousCard();
      }

      if (key === "w" || event.key === "ArrowUp") {
        flipCard();
      }
    });
  </script>
</body>
</html>
