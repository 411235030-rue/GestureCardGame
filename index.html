<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gesture Card Game</title>
  <style>
    :root {
      --bg: #f7efed;
      --paper: #fffaf8;
      --ink: #423b42;
      --muted: #8e8388;
      --rose: #ddb0aa;
      --rose-deep: #c99089;
      --line: rgba(92, 74, 84, .12);
      --shadow: 0 28px 70px rgba(102, 73, 85, .15);
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 8%, rgba(237, 193, 185, .52), transparent 28%),
        radial-gradient(circle at 89% 78%, rgba(215, 198, 213, .36), transparent 30%),
        var(--bg);
      min-height: 100vh;
      overflow: hidden;
    }

    button { font: inherit; }

    .screen {
      display: none;
      min-height: 100vh;
      width: 100vw;
    }

    .screen.active { display: flex; }

    /* ---------- Welcome ---------- */
    #welcomeScreen {
      position: relative;
      align-items: stretch;
      overflow: hidden;
      padding: 30px clamp(28px, 6vw, 96px) 42px;
    }

    #welcomeScreen::before,
    #welcomeScreen::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      filter: blur(2px);
      pointer-events: none;
    }

    #welcomeScreen::before {
      width: 320px;
      height: 320px;
      left: -110px;
      bottom: -115px;
      background: rgba(232, 192, 185, .35);
    }

    #welcomeScreen::after {
      width: 230px;
      height: 230px;
      right: -70px;
      top: 12%;
      background: rgba(206, 191, 209, .30);
    }

    .welcome-nav {
      position: absolute;
      top: 30px;
      left: clamp(28px, 6vw, 96px);
      right: clamp(28px, 6vw, 96px);
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: #776c71;
    }

    .welcome-shell {
      position: relative;
      z-index: 2;
      width: min(1180px, 100%);
      margin: auto;
      display: grid;
      grid-template-columns: minmax(340px, 1fr) minmax(360px, .92fr);
      gap: clamp(44px, 7vw, 100px);
      align-items: center;
    }

    .hero-art {
      position: relative;
      min-height: 570px;
      display: grid;
      place-items: center;
      transform: translateY(-35px);
    }

    .hero-art::before {
      content: "";
      position: absolute;
      width: 84%;
      height: 72%;
      border-radius: 46% 54% 58% 42% / 55% 42% 58% 45%;
      background: rgba(255,255,255,.46);
      border: 1px solid rgba(255,255,255,.72);
      transform: rotate(-7deg);
    }

    .hero-card {
      position: absolute;
      width: min(290px, 62%);
      aspect-ratio: 2.5 / 3.5;
      border-radius: 24px;
      border: 7px solid rgba(255,255,255,.94);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .hero-card.back {
      display: grid;
      place-items: center;
      color: white;
      background:
        radial-gradient(circle at 28% 20%, rgba(255,255,255,.28), transparent 28%),
        linear-gradient(155deg, #9d8798, #d6a8a7 60%, #edc5bc);
      font-family: Georgia, serif;
      font-size: 54px;
    }

    .hero-card.back small {
      display: block;
      margin-top: 8px;
      font: 600 11px/1 Inter, "Segoe UI", sans-serif;
      letter-spacing: .28em;
      text-align: center;
    }

    .hero-card.photo { background: #f2e9e6; }
    .hero-card.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .hero-card.one { transform: translate(-35%, 4%) rotate(-11deg); }
    .hero-card.two { z-index: 2; transform: translate(8%, -4%) rotate(4deg); }
    .hero-card.three { transform: translate(40%, 14%) rotate(12deg); }

    .welcome-copy { max-width: 520px; }

    .eyebrow {
      margin: 0 0 16px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--rose-deep);
    }

    .welcome-copy h1 {
      margin: 0;
      max-width: 540px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(50px, 5.4vw, 78px);
      font-weight: 500;
      line-height: .98;
      letter-spacing: -.035em;
      color: #3f3940;
    }

    .welcome-copy .lead {
      max-width: 470px;
      margin: 26px 0 0;
      font-size: 17px;
      line-height: 1.85;
      color: #766c71;
    }

    #startBtn {
      margin-top: 32px;
      min-width: 152px;
      border: 0;
      border-radius: 8px;
      padding: 15px 28px;
      background: var(--rose);
      color: #fff;
      font-weight: 700;
      letter-spacing: .04em;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(188, 129, 123, .20);
      transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
    }

    #startBtn:hover {
      transform: translateY(-2px);
      background: var(--rose-deep);
      box-shadow: 0 16px 34px rgba(188, 129, 123, .25);
    }

    #startBtn:disabled { opacity: .6; cursor: wait; }

    .welcome-gestures {
      margin-top: 34px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      color: #91858a;
      font-size: 12px;
    }

    .welcome-gestures span {
      display: inline-flex;
      gap: 7px;
      align-items: center;
    }

    .gesture-mark {
      width: 23px;
      height: 23px;
      display: inline-grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255,255,255,.7);
      border: 1px solid var(--line);
      color: #8c747a;
    }

    .error-box {
      display: none;
      margin-top: 4px;
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(255,255,255,.76);
      border: 1px solid rgba(185, 128, 124, .18);
      color: #765f64;
      line-height: 1.6;
      font-size: 13px;
    }

    /* ---------- Game ---------- */
    #gameScreen {
      position: relative;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 74px 28px 30px;
      overflow: hidden;
    }

    .game-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      height: 58px;
      padding: 0 clamp(24px, 4vw, 64px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(247,239,237,.72);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(91,72,82,.06);
    }

    .game-actions { display: flex; align-items: center; gap: 10px; }

    .debug-toggle {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.72);
      color: #786d72;
      border-radius: 999px;
      padding: 9px 14px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      transition: .2s ease;
    }

    .debug-toggle:hover,
    .debug-toggle.active { background: #fff; color: #4d454a; }

    .topbar {
      position: absolute;
      top: 74px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 12;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,.78);
      border: 1px solid rgba(255,255,255,.86);
      box-shadow: 0 12px 30px rgba(99,75,86,.08);
      backdrop-filter: blur(12px);
      white-space: nowrap;
      font-size: 12px;
      color: #756b70;
    }

    #cameraDot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #b7b2b4;
      flex: 0 0 auto;
    }

    #cameraDot.on {
      background: #57c98b;
      box-shadow: 0 0 0 5px rgba(87,201,139,.12);
    }

    .gesture-toggle {
      margin-left: 3px;
      border: 0;
      border-radius: 999px;
      padding: 6px 10px;
      background: rgba(255,255,255,.72);
      color: #82777c;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: background .18s ease, color .18s ease, transform .18s ease;
    }

    .gesture-toggle:hover {
      background: #fff;
      color: #554c51;
      transform: translateY(-1px);
    }

    .gesture-toggle.off {
      background: rgba(221,176,170,.18);
      color: #9d7774;
    }

    .gesture-toggle:disabled {
      opacity: .55;
      cursor: wait;
      transform: none;
    }

    .game-main {
      width: 100%;
      display: grid;
      place-items: center;
      margin-top: 18px;
    }

    .deck-shell {
      position: relative;
      width: min(96vw, 1000px);
      height: min(67vh, 560px);
      transform: translateY(-24px);
      display: grid;
      place-items: center;
      perspective: 1500px;
      --rail-shift: 0px;
      --slide-distance: min(22.4vw, 196px);
      --center-scale: 1;
    }

    .stack-peek {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(28vw, 245px);
      aspect-ratio: 2.5 / 3.5;
      border-radius: 22px;
      border: 5px solid rgba(255,255,255,.9);
      background:
        radial-gradient(circle at 28% 20%, rgba(255,255,255,.22), transparent 26%),
        linear-gradient(155deg, #a390a0, #d2a6a5 60%, #edc5bd);
      box-shadow: 0 18px 42px rgba(84,61,72,.12);
      color: rgba(255,255,255,.94);
      display: grid;
      place-items: center;
      overflow: hidden;
      pointer-events: none;
      transform:
        translate(calc(var(--x) + var(--rail-shift)), -50%)
        scale(var(--scale))
        rotateY(var(--ry));
      transform-origin: center;
      transition:
        transform .06s linear,
        opacity .32s ease,
        filter .32s ease,
        box-shadow .32s ease;
      opacity: var(--opacity);
      filter: saturate(.82) brightness(.97);
    }

    .stack-peek span {
      font: 500 38px/1 Georgia, serif;
      opacity: .78;
    }

    .stack-peek img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #eee5e2;
    }

    .stack-peek.is-revealed {
      background: #eee5e2;
    }

    .stack-peek.sr {
      border-color: #e5bd4f;
      box-shadow:
        0 0 0 1px rgba(255,239,176,.62),
        0 0 18px rgba(238,194,73,.34),
        0 18px 42px rgba(84,61,72,.12);
      animation: srSideGlow 1.65s ease-in-out infinite;
    }

    @keyframes srSideGlow {
      0%, 100% {
        box-shadow: 0 0 0 1px rgba(255,239,176,.5), 0 0 9px rgba(238,194,73,.25), 0 18px 42px rgba(84,61,72,.12);
      }
      50% {
        box-shadow: 0 0 0 1px rgba(255,248,211,.88), 0 0 26px rgba(255,218,101,.58), 0 18px 42px rgba(84,61,72,.12);
      }
    }

    #peekPrev3,
    #peekNext3 { display: none; }

    #peekPrev2 { --x: -195%; --scale: .68; --ry: 30deg; --opacity: .42; z-index: 1; }
    #peekPrev1 { --x: -130%; --scale: .84; --ry: 20deg; --opacity: .76; z-index: 3; }
    #peekNext1 { --x: 30%; --scale: .84; --ry: -20deg; --opacity: .76; z-index: 3; }
    #peekNext2 { --x: 95%; --scale: .68; --ry: -30deg; --opacity: .42; z-index: 1; }

    .stack-peek.is-hidden {
      opacity: 0 !important;
      pointer-events: none;
    }

    .card-stage {
      width: min(72vw, 310px);
      aspect-ratio: 2.5 / 3.5;
      perspective: 1200px;
      position: relative;
      z-index: 6;
      transform: translateX(var(--rail-shift)) scale(var(--center-scale));
      transition:
        transform .06s linear,
        opacity .3s ease;
      opacity: 1;
    }

    .deck-shell.carousel-next {
      --rail-shift: calc(var(--slide-distance) * -1);
      --center-scale: .82;
    }

    .deck-shell.carousel-prev {
      --rail-shift: var(--slide-distance);
      --center-scale: .82;
    }

    .deck-shell.carousel-next .card-stage,
    .deck-shell.carousel-prev .card-stage {
      opacity: .42;
    }

    .deck-shell.carousel-next #peekNext1,
    .deck-shell.carousel-prev #peekPrev1 {
      --scale: 1.04;
      --ry: 0deg;
      --opacity: 1;
      z-index: 8;
      filter: saturate(1) brightness(1);
    }

    .deck-shell.snap-reset .stack-peek,
    .deck-shell.snap-reset .card-stage {
      transition: none !important;
    }

    .card {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transition: transform .52s cubic-bezier(.2,.8,.2,1), opacity .32s ease;
      border-radius: 24px;
    }

    .card.instant-state {
      transition: none !important;
    }

    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 24px;
      backface-visibility: hidden;
      overflow: hidden;
      border: 6px solid rgba(255,255,255,.95);
      box-shadow: 0 25px 60px rgba(79,56,68,.18);
    }

    .card-back {
      display: grid;
      place-items: center;
      text-align: center;
      color: white;
      background:
        radial-gradient(circle at 27% 19%, rgba(255,255,255,.30), transparent 27%),
        linear-gradient(155deg, #9c899a, #d3a5a5 59%, #efc8be);
    }

    .card-back span {
      display: block;
      font: 500 clamp(64px, 8vw, 92px)/.95 Georgia, serif;
    }

    .card-back small {
      display: block;
      margin-top: 14px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .32em;
      opacity: .88;
    }

    .card-front {
      transform: rotateY(180deg);
      padding: 0;
      background: #eee5e2;
    }

    .card-front img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #eee5e2;
    }

    /* ---------- SR cards ---------- */
    .card.sr .card-face {
      border-color: #e5bd4f;
      box-shadow: 0 0 0 1px rgba(255,239,176,.75), 0 0 14px rgba(238,194,73,.48), 0 0 34px rgba(255,215,93,.28), 0 25px 60px rgba(79,56,68,.18);
      animation: srGoldGlow 1.65s ease-in-out infinite;
    }

    .card.sr .card-back {
      background: radial-gradient(circle at 27% 19%, rgba(255,255,255,.42), transparent 27%), radial-gradient(circle at 78% 72%, rgba(255,246,196,.34), transparent 34%), linear-gradient(145deg, #a98228 0%, #d9b94f 34%, #f5dd8c 62%, #b88d2e 100%);
      color: #fffdf4;
    }


    @keyframes srGoldGlow {
      0%, 100% {
        border-color: #d9ad38;
        box-shadow: 0 0 0 1px rgba(255,239,176,.55), 0 0 9px rgba(238,194,73,.30), 0 0 22px rgba(255,215,93,.18), 0 25px 60px rgba(79,56,68,.18);
      }
      50% {
        border-color: #ffe49a;
        box-shadow: 0 0 0 1px rgba(255,248,211,.92), 0 0 20px rgba(255,218,101,.72), 0 0 42px rgba(245,190,48,.42), 0 25px 60px rgba(79,56,68,.18);
      }
    }

    .card.flipped { transform: rotateY(180deg); }
    .card.fly-left { transform: translateX(-115vw) rotate(-15deg); opacity: 0; }
    .card.fly-right { transform: translateX(115vw) rotate(15deg); opacity: 0; }

    .controls {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      width: min(680px, calc(100vw - 42px));
      text-align: center;
      z-index: 10;
    }

    #gestureStatus {
      margin-bottom: 12px;
      min-height: 20px;
      font-size: 13px;
      font-weight: 700;
      color: #665a60;
    }

    .control-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .control-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.64);
      border: 1px solid rgba(255,255,255,.82);
      color: #81767b;
      font-size: 11px;
      box-shadow: 0 7px 18px rgba(93,70,81,.05);
    }

    .control-chip b {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #fff;
      color: #9b777b;
      font-size: 12px;
    }

    .keyboard-note {
      margin-top: 9px;
      color: #a19599;
      font-size: 10px;
      letter-spacing: .02em;
    }

    #debugPanel {
      position: fixed;
      right: clamp(18px, 3vw, 42px);
      top: 82px;
      z-index: 50;
      width: min(300px, calc(100vw - 36px));
      max-height: calc(100vh - 110px);
      overflow: auto;
      padding: 15px 17px;
      border-radius: 14px;
      background: rgba(48,43,47,.91);
      color: #fff;
      box-shadow: 0 18px 46px rgba(49,37,43,.22);
      font-family: Consolas, monospace;
      white-space: pre-line;
      font-size: 11px;
      line-height: 1.55;
      opacity: 0;
      transform: translateY(-8px) scale(.98);
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }

    #debugPanel.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    #webcam {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      left: -9999px;
      top: -9999px;
    }

    @media (max-width: 860px) {
      body { overflow: auto; }
      #welcomeScreen { padding-top: 86px; overflow: auto; }
      .welcome-shell { grid-template-columns: 1fr; gap: 18px; text-align: center; }
      .hero-art { min-height: 390px; order: 2; }
      .welcome-copy { margin: 0 auto; }
      .welcome-copy .lead { margin-left: auto; margin-right: auto; }
      .welcome-gestures { justify-content: center; }
      .hero-card { width: min(230px, 55%); }
      .game-header { height: 54px; }
      .topbar { top: 68px; }
      #gameScreen { padding-top: 66px; }
      .deck-shell { height: min(66vh, 510px); }
    }

    @media (max-width: 520px) {
      body { overflow: hidden; }
      .brand { font-size: 11px; }
      #welcomeScreen {
        min-height: 100svh;
        padding: 72px 20px 24px;
        overflow-y: auto;
      }
      .welcome-nav { top: 22px; left: 20px; right: 20px; }
      .welcome-shell { gap: 6px; }
      .welcome-copy h1 { font-size: clamp(42px, 13vw, 58px); }
      .welcome-copy .lead { margin-top: 18px; font-size: 14px; line-height: 1.65; }
      #startBtn { margin-top: 22px; width: min(240px, 80vw); }
      .welcome-gestures { margin-top: 22px; gap: 8px 12px; font-size: 11px; }
      .hero-art { min-height: 285px; transform: translateY(-8px); }
      .hero-card { width: min(170px, 54%); border-width: 5px; border-radius: 18px; }

      #gameScreen {
        height: 100svh;
        min-height: 100svh;
        padding: 58px 12px 96px;
        overflow: hidden;
      }
      .game-header { height: 50px; padding: 0 18px; }
      .debug-toggle { padding: 8px 11px; }
      .topbar { top: 60px; padding: 8px 13px; }
      .game-main { margin-top: 8px; }
      .deck-shell {
        width: 100vw;
        height: min(60svh, 500px);
        transform: translateY(-6px);
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        --slide-distance: min(44vw, 170px);
      }
      .card-stage { width: min(74vw, 285px); }
      .stack-peek {
        width: min(44vw, 170px);
        border-width: 4px;
        border-radius: 18px;
      }
      #peekPrev3,
      #peekNext3 { display: grid; }
      #peekPrev3 { --x: -285%; --scale: .44; --ry: 38deg; --opacity: .24; z-index: 0; }
      #peekPrev2 { --x: -220%; --scale: .56; --ry: 32deg; --opacity: .38; z-index: 1; }
      #peekPrev1 { --x: -150%; --scale: .74; --ry: 22deg; --opacity: .70; z-index: 3; }
      #peekNext1 { --x: 50%; --scale: .74; --ry: -22deg; --opacity: .70; z-index: 3; }
      #peekNext2 { --x: 120%; --scale: .56; --ry: -32deg; --opacity: .38; z-index: 1; }
      #peekNext3 { --x: 185%; --scale: .44; --ry: -38deg; --opacity: .24; z-index: 0; }
      .card, .card-face { border-radius: 20px; }
      .card-face { border-width: 5px; }
      .controls { bottom: 14px; width: calc(100vw - 24px); }
      #gestureStatus { margin-bottom: 8px; }
      .control-row { gap: 6px; }
      .control-chip { padding: 7px 9px; font-size: 10px; }
      .keyboard-note { display: none; }

      body.touch-mode .debug-toggle { display: none; }
      body.touch-mode #cameraDot { display: none; }
      body.touch-mode .control-chip.start-pose-chip { display: none; }
    }
  </style>
</head>
<body>
  <section id="welcomeScreen" class="screen active">
    <nav class="welcome-nav">
      <div class="brand">Made by line</div>
    </nav>

    <div class="welcome-shell">
      <div class="hero-art" aria-hidden="true">
        <div class="hero-card back one"><div>07<small>CARD</small></div></div>
        <div class="hero-card photo two"><img src="card/card3.jpeg" alt="" /></div>
        <div class="hero-card back three"><div>12<small>CARD</small></div></div>
      </div>

      <div class="welcome-copy">
        <p class="eyebrow">Gesture × Card</p>
        <h1>Gesture<br />Card Game</h1>
        <p class="lead">先握拳啟動操作模式，左右滑開始連續巡卡，握拳停住後再往上滑翻牌。</p>
        <button id="startBtn">開始抽卡</button>

        <div class="welcome-gestures" aria-label="操作方式">
          <span><i class="gesture-mark">◫</i> 握拳 · 啟動 / 停止</span>
          <span><i class="gesture-mark">←</i> 向左巡卡</span>
          <span><i class="gesture-mark">↑</i> 停住後翻牌</span>
          <span><i class="gesture-mark">→</i> 向右巡卡</span>
        </div>

        <div id="errorBox" class="error-box"></div>
      </div>
    </div>
  </section>

  <section id="gameScreen" class="screen">
    <header class="game-header">
      <div class="brand">Made by line</div>
      <div class="game-actions">
        <button id="debugToggle" class="debug-toggle" type="button" aria-expanded="false">Debug</button>
      </div>
    </header>

    <div id="cameraStatusBar" class="topbar">
      <span id="cameraDot"></span>
      <span id="cameraText">準備鏡頭中</span>
      <button id="gestureToggle" class="gesture-toggle" type="button">關閉</button>
    </div>

    <main class="game-main">
      <div class="deck-shell">
        <div id="peekPrev3" class="stack-peek"><span>1</span></div>
        <div id="peekPrev2" class="stack-peek"><span>1</span></div>
        <div id="peekPrev1" class="stack-peek"><span>1</span></div>

        <div class="card-stage">
          <div id="card" class="card">
            <div class="card-face card-back">
              <div>
                <span id="backNumber">1</span>
                <small>CARD</small>
              </div>
            </div>

            <div id="cardFront" class="card-face card-front">
              <img id="cardImage" src="card/card1.jpeg" alt="CARD 01" />
            </div>
          </div>
        </div>

        <div id="peekNext1" class="stack-peek"><span>2</span></div>
        <div id="peekNext2" class="stack-peek"><span>3</span></div>
        <div id="peekNext3" class="stack-peek"><span>4</span></div>
      </div>
    </main>

    <div class="controls">
      <div id="gestureStatus">把手放到鏡頭前</div>
      <div class="control-row">
        <span class="control-chip start-pose-chip"><b>◫</b>握拳 · 啟動 / 停止</span>
        <span class="control-chip"><b>←</b>向左巡卡</span>
        <span class="control-chip"><b>↑</b>停住後翻牌</span>
        <span class="control-chip"><b>→</b>向右巡卡</span>
      </div>
      <div class="keyboard-note">Keyboard test · A / W / D</div>
    </div>
  </section>

  <div id="debugPanel">Hand: NO
Result: 等待開始</div>
  <video id="webcam" autoplay playsinline muted></video>

  <script type="module">
    import {
      HandLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/+esm";

    // ==========================================
    // 1. 固定測試卡
    // 之後你只要把這裡換成真正卡片資料 / 圖片即可
    // ==========================================
    const cards = Array.from({ length: 20 }, (_, i) => ({
      image: `card/card${i + 1}.jpeg`,
      rarity: [18, 20].includes(i + 1) ? "SR" : "R"
    }));

    // 預先載入 20 張卡片，翻牌時比較順
    cards.forEach((data) => {
      const image = new Image();
      image.src = data.image;
    });

    // ==========================================
    // 2. DOM
    // ==========================================
    const welcomeScreen = document.querySelector("#welcomeScreen");
    const gameScreen = document.querySelector("#gameScreen");
    const startBtn = document.querySelector("#startBtn");
    const webcam = document.querySelector("#webcam");

    const card = document.querySelector("#card");
    const cardFront = document.querySelector("#cardFront");
    const cardImage = document.querySelector("#cardImage");
    const backNumber = document.querySelector("#backNumber");
    const peekPrev3 = document.querySelector("#peekPrev3");
    const peekPrev2 = document.querySelector("#peekPrev2");
    const peekPrev1 = document.querySelector("#peekPrev1");
    const peekNext1 = document.querySelector("#peekNext1");
    const peekNext2 = document.querySelector("#peekNext2");
    const peekNext3 = document.querySelector("#peekNext3");
    const debugToggle = document.querySelector("#debugToggle");

    const cameraDot = document.querySelector("#cameraDot");
    const cameraText = document.querySelector("#cameraText");
    const cameraStatusBar = document.querySelector("#cameraStatusBar");
    const gestureToggle = document.querySelector("#gestureToggle");
    const gestureStatus = document.querySelector("#gestureStatus");
    const errorBox = document.querySelector("#errorBox");
    const debugPanel = document.querySelector("#debugPanel");
    const welcomeLead = document.querySelector(".welcome-copy .lead");
    const welcomeGestures = document.querySelector(".welcome-gestures");
    const controlRow = document.querySelector(".control-row");
    const keyboardNote = document.querySelector(".keyboard-note");
    const deckShell = document.querySelector(".deck-shell");

    // 手機 / 平板以觸控為主；桌機維持相機手勢。
    const isTouchMode =
      window.matchMedia("(pointer: coarse) and (hover: none)").matches ||
      (window.innerWidth <= 860 && navigator.maxTouchPoints > 0);

    if (isTouchMode) {
      document.body.classList.add("touch-mode");
      cameraStatusBar.style.display = "none";
      startBtn.textContent = "開始抽卡";
      welcomeLead.textContent = "左右滑動切換卡片，點一下或往上滑即可翻開你的收藏照片。";
      welcomeGestures.innerHTML = `
        <span><i class="gesture-mark">←</i> 左滑 · 下一張</span>
        <span><i class="gesture-mark">○</i> 點一下 · 翻牌</span>
        <span><i class="gesture-mark">→</i> 右滑 · 上一張</span>
      `;
    }

    // ==========================================
    // 3. 遊戲狀態
    // ==========================================
    let currentIndex = 0;

    // 本輪翻過的卡會維持揭露；重新整理頁面後 Set 會自然重置。
    let isAnimating = false;
    const revealedCards = new Set();

    // 桌機手勢巡卡：左右滑一次後持續移動，握拳才停止。
    let autoScrollDirection = null; // "next" | "previous" | null
    let autoScrollTimer = null;
    const AUTO_SCROLL_INTERVAL_MS = 60;
    const CAROUSEL_ANIMATION_MS = 60;
    const AUTO_SCROLL_GAP_MS = Math.max(0, AUTO_SCROLL_INTERVAL_MS - CAROUSEL_ANIMATION_MS);

    function updateCard() {
      const data = cards[currentIndex];
      const revealed = revealedCards.has(currentIndex);

      // 先瞬間回到卡背，再換圖片，避免未翻過的新卡閃出正面。
      // 若這張卡本輪已翻過，再於同一幀直接套回 flipped，不播放重複翻牌動畫。
      card.className = "card instant-state";
      if (data.rarity === "SR") {
        card.classList.add("sr");
      }

      backNumber.textContent = currentIndex + 1;

      cardImage.src = data.image;
      cardImage.alt =
        `CARD ${String(currentIndex + 1).padStart(2, "0")}`;

      cardFront.className = "card-face card-front";
      if (revealed) {
        card.classList.add("flipped");
      }

      updateDeckPeeks();

      // 強制套用這次的無動畫狀態，下一幀恢復正常翻牌動畫。
      void card.offsetWidth;
      requestAnimationFrame(() => {
        card.classList.remove("instant-state");
      });
    }

    function setPeek(element, index) {
      if (!element) return;

      const valid = index >= 0 && index < cards.length;
      element.classList.toggle("is-hidden", !valid);

      if (!valid) {
        element.classList.remove("is-revealed", "sr");
        return;
      }

      const data = cards[index];
      const revealed = revealedCards.has(index);

      element.classList.toggle("is-revealed", revealed);
      element.classList.toggle("sr", data.rarity === "SR");
      element.innerHTML = revealed
        ? `<img src="${data.image}" alt="" />`
        : `<span>${index + 1}</span>`;
    }

    function updateDeckPeeks() {
      setPeek(peekPrev3, currentIndex - 3);
      setPeek(peekPrev2, currentIndex - 2);
      setPeek(peekPrev1, currentIndex - 1);
      setPeek(peekNext1, currentIndex + 1);
      setPeek(peekNext2, currentIndex + 2);
      setPeek(peekNext3, currentIndex + 3);
    }

    function flipCard() {
      if (isAnimating) return;
      if (card.classList.contains("flipped")) return;

      card.classList.add("flipped");
      revealedCards.add(currentIndex);
      updateDeckPeeks();
      gestureStatus.textContent = "↑ 翻牌";
    }

    function clearAutoScrollTimer() {
      if (autoScrollTimer) {
        clearTimeout(autoScrollTimer);
        autoScrollTimer = null;
      }
    }

    function stopAutoScroll(message = "巡卡已停止 · 可上滑翻牌") {
      autoScrollDirection = null;
      clearAutoScrollTimer();
      gestureStatus.textContent = message;
    }

    function scheduleAutoScrollStep() {
      if (isTouchMode || !gestureArmed || !autoScrollDirection || isAnimating) return;

      clearAutoScrollTimer();
      autoScrollTimer = setTimeout(() => {
        autoScrollTimer = null;

        if (autoScrollDirection === "next") {
          nextCard();
        } else if (autoScrollDirection === "previous") {
          previousCard();
        }
      }, AUTO_SCROLL_GAP_MS);
    }

    function startAutoScroll(direction) {
      if (isTouchMode || !gestureArmed) return;
      if (direction !== "next" && direction !== "previous") return;

      autoScrollDirection = direction;
      clearAutoScrollTimer();

      gestureStatus.textContent = direction === "next"
        ? "← 向左巡卡中 · 握拳停止"
        : "→ 向右巡卡中 · 握拳停止";

      if (!isAnimating) {
        if (direction === "next") {
          nextCard();
        } else {
          previousCard();
        }
      }
    }

    function finishCarouselMove(delta) {
      setTimeout(() => {
        currentIndex += delta;
        deckShell.classList.add("snap-reset");
        updateCard();
        deckShell.classList.remove("carousel-next", "carousel-prev");
        void deckShell.offsetWidth;

        requestAnimationFrame(() => {
          deckShell.classList.remove("snap-reset");
          isAnimating = false;

          // 巡卡狀態仍在時，補足到約 600ms / 張後自動走下一張。
          if (autoScrollDirection) {
            scheduleAutoScrollStep();
          }
        });
      }, CAROUSEL_ANIMATION_MS);
    }

    function nextCard() {
      if (isAnimating) return;

      if (currentIndex >= cards.length - 1) {
        if (autoScrollDirection) {
          stopAutoScroll("已到最後一張 · 巡卡停止");
        } else {
          gestureStatus.textContent = "已經是最後一張";
        }
        return;
      }

      isAnimating = true;
      gestureStatus.textContent = autoScrollDirection === "next"
        ? "← 向左巡卡中 · 握拳停止"
        : "← 下一張";
      deckShell.classList.add("carousel-next");
      finishCarouselMove(1);
    }

    function previousCard() {
      if (isAnimating) return;

      if (currentIndex <= 0) {
        if (autoScrollDirection) {
          stopAutoScroll("已到第一張 · 巡卡停止");
        } else {
          gestureStatus.textContent = "已經是第一張";
        }
        return;
      }

      isAnimating = true;
      gestureStatus.textContent = autoScrollDirection === "previous"
        ? "→ 向右巡卡中 · 握拳停止"
        : "→ 上一張";
      deckShell.classList.add("carousel-prev");
      finishCarouselMove(-1);
    }

    // ==========================================
    // 4. MediaPipe 手部辨識
    // ==========================================
    let handLandmarker = null;
    let cameraStream = null;
    let detectionStarted = false;

    // 手勢追蹤
    let gestureStart = null;
    let lastHandSeenAt = 0;
    let lastGestureAt = 0;
    let lastPosition = null;
    let gestureArmed = false;

    // 雙手同時出現時固定右手優先，右手短暫離開時先等待，不立刻跳到左手。
    let activeHandLabel = null;
    let rightHandLastSeenAt = 0;
    const RIGHT_HAND_GRACE_MS = 500;
    const HAND_LOST_RESET_MS = 1000;

    // 起點手勢：握拳維持一小段時間，啟動或重新設定操作模式
    let startPoseSince = 0;
    let startPoseConfirmed = false;
    let startPosePoint = null;
    const START_POSE_HOLD_MS = 220;

    // 手勢門檻：左右保持靈敏；上滑需要更明顯位移，避免輕微往上就翻牌
    const HORIZONTAL_THRESHOLD = 0.12;
    const UP_THRESHOLD = 0.2;
    const GESTURE_WINDOW_MS = 1200;
    const GESTURE_COOLDOWN_MS = 700;
    const MIN_MOVEMENT_SPEED = 0.00010;
    const DIRECTION_RATIO = 1.15;

    // 偵錯面板只更新 4 次/秒，不要每一幀狂跳
    const DEBUG_INTERVAL_MS = 250;
    let lastDebugAt = 0;
    let lastDebugLines = ["Hand: NO", "Result: 等待開始"];

    async function createHandLandmarker() {
      cameraText.textContent = "載入手部辨識";

      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm"
      );

      handLandmarker = await HandLandmarker.createFromOptions(
        vision,
        {
          baseOptions: {
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
            delegate: "GPU"
          },
          runningMode: "VIDEO",
          numHands: 2,
          minHandDetectionConfidence: 0.55,
          minHandPresenceConfidence: 0.55,
          minTrackingConfidence: 0.55
        }
      );
    }

    async function startCamera() {
      if (!navigator.mediaDevices?.getUserMedia) {
        throw new Error("這個瀏覽器不支援相機存取。");
      }

      cameraText.textContent = "等待相機權限";

      cameraStream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user",
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      });

      webcam.srcObject = cameraStream;

      await new Promise((resolve) => {
        webcam.onloadedmetadata = resolve;
      });

      await webcam.play();

      cameraDot.classList.add("on");
      cameraText.textContent = "手勢辨識中";
    }

    function stopGestureRecognition() {
      detectionStarted = false;

      if (cameraStream) {
        cameraStream.getTracks().forEach((track) => track.stop());
        cameraStream = null;
      }

      webcam.srcObject = null;
      cameraDot.classList.remove("on");
      cameraText.textContent = "手勢辨識已關閉";
      gestureToggle.textContent = "開啟";
      gestureToggle.classList.add("off");

      stopAutoScroll();
      gestureArmed = false;
      gestureStatus.textContent = "手勢辨識已關閉";
      gestureStart = null;
      lastPosition = null;
      startPoseSince = 0;
      startPoseConfirmed = false;
      startPosePoint = null;
      activeHandLabel = null;
    }

    async function startGestureRecognition() {
      gestureToggle.disabled = true;
      gestureToggle.textContent = "啟動中";

      try {
        if (!handLandmarker) {
          await createHandLandmarker();
        }

        await startCamera();
        detectionStarted = true;
        gestureToggle.textContent = "關閉";
        gestureToggle.classList.remove("off");
        gestureStatus.textContent = "請先握拳啟動操作模式";
        requestAnimationFrame(detectLoop);
      } catch (error) {
        console.error(error);
        cameraDot.classList.remove("on");
        cameraText.textContent = "辨識啟動失敗";
        gestureToggle.textContent = "重試";
        gestureToggle.classList.add("off");
      } finally {
        gestureToggle.disabled = false;
      }
    }

    // 取手掌中心，會比只追某一根手指穩
    function getPalmCenter(landmarks) {
      const indices = [0, 5, 9, 13, 17];

      let x = 0;
      let y = 0;

      for (const index of indices) {
        x += landmarks[index].x;
        y += landmarks[index].y;
      }

      x /= indices.length;
      y /= indices.length;

      // 自拍鏡頭以「鏡子」直覺操作
      // 所以 X 軸反轉
      return {
        x: 1 - x,
        y
      };
    }


    function distance2D(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    // 判斷「握拳起點手勢」：至少三根手指明顯彎曲即可。
    // 不限制拇指位置，降低不同握拳習慣造成的辨識失敗。
    function isStartPose(landmarks) {
      const wrist = landmarks[0];
      const fingerPairs = [
        [8, 6],
        [12, 10],
        [16, 14],
        [20, 18]
      ];

      const curledCount = fingerPairs.filter(([tip, pip]) =>
        distance2D(landmarks[tip], wrist) < distance2D(landmarks[pip], wrist) * 1.12
      ).length;

      return curledCount >= 3;
    }

    function handleStartPose(landmarks, position, now) {
      const pose = isStartPose(landmarks);

      if (pose) {
        startPosePoint = { x: position.x, y: position.y };

        if (!startPoseSince) {
          startPoseSince = now;
          startPoseConfirmed = false;
        }

        const held = now - startPoseSince;
        const progress = Math.min(100, Math.round(held / START_POSE_HOLD_MS * 100));

        if (held >= START_POSE_HOLD_MS) {
          // 一次握拳只觸發一次：第一次用來啟動，巡卡中則用來停止。
          if (!startPoseConfirmed) {
            startPoseConfirmed = true;
            gestureStart = null;
            lastPosition = null;

            if (autoScrollDirection) {
              stopAutoScroll("握拳停止巡卡 ✓");
              gestureArmed = true;
              setDebug([
                "Hand: YES",
                "Pose: FIST ✓",
                `x: ${position.x.toFixed(3)}  y: ${position.y.toFixed(3)}`,
                "Result: 巡卡停止，等待目前卡片對齊"
              ], now, true);
            } else if (!gestureArmed) {
              gestureStatus.textContent = "握拳辨識成功 ✓";
              setDebug([
                "Hand: YES",
                "Pose: FIST ✓",
                `x: ${position.x.toFixed(3)}  y: ${position.y.toFixed(3)}`,
                "Result: 握拳成功，放開後進入操作模式"
              ], now, true);
            } else {
              gestureStatus.textContent = "握拳辨識成功 ✓";
              setDebug([
                "Hand: YES",
                "Pose: FIST ✓",
                `x: ${position.x.toFixed(3)}  y: ${position.y.toFixed(3)}`,
                "Result: 重新設定操作起點"
              ], now, true);
            }
          }
        } else {
          gestureStatus.textContent = autoScrollDirection
            ? `握拳停止 ${progress}%`
            : `設定起點 ${progress}%`;
          setDebug([
            "Hand: YES",
            "Pose: FIST",
            `Hold: ${progress}%`,
            autoScrollDirection
              ? "Result: 維持握拳以停止巡卡"
              : "Result: 維持握拳以啟動操作模式"
          ], now);
        }

        // 維持握拳期間完全不判斷滑動。
        return true;
      }

      // 放開握拳後，以最後的握拳位置作為新起點；操作模式維持啟用。
      if (startPoseSince) {
        if (startPoseConfirmed && startPosePoint) {
          gestureStart = {
            x: startPosePoint.x,
            y: startPosePoint.y,
            time: now
          };
          lastPosition = { ...startPosePoint };
          gestureArmed = true;
          lastGestureAt = 0;
          gestureStatus.textContent = "操作模式已啟用 ✓";
          setDebug([
            "Hand: YES",
            "Pose: RELEASED",
            `Start x: ${startPosePoint.x.toFixed(3)}  y: ${startPosePoint.y.toFixed(3)}`,
            "Result: 可左右滑開始巡卡；停住後可上滑翻牌"
          ], now, true);
        }

        startPoseSince = 0;
        startPoseConfirmed = false;
        startPosePoint = null;
      }

      return false;
    }

    function resetGestureTracking(position = null, now = performance.now()) {
      gestureStart = position
        ? {
            x: position.x,
            y: position.y,
            time: now
          }
        : null;
    }

    function setDebug(lines, now = performance.now(), force = false) {
      lastDebugLines = lines;
      if (!force && now - lastDebugAt < DEBUG_INTERVAL_MS) return;
      lastDebugAt = now;
      debugPanel.textContent = lines.join("\n");
    }

    function processHandMovement(position, now) {
      lastHandSeenAt = now;

      // 沒有完成起點手勢就完全禁止滑動，避免自然移動造成誤觸。
      if (!gestureArmed) {
        gestureStart = null;
        lastPosition = null;
        gestureStatus.textContent = "請先握拳啟動操作模式";
        setDebug([
          "Hand: YES",
          `x: ${position.x.toFixed(3)}  y: ${position.y.toFixed(3)}`,
          "Result: LOCKED · 請先握拳"
        ], now);
        return;
      }

      // 巡卡中只接受握拳停止；左右與上滑都先忽略。
      // handleStartPose 會在本函式之前執行，所以握拳仍能立即生效。
      if (autoScrollDirection) {
        gestureStart = null;
        lastPosition = null;
        gestureStatus.textContent = autoScrollDirection === "next"
          ? "← 向左巡卡中 · 握拳停止"
          : "→ 向右巡卡中 · 握拳停止";
        setDebug([
          "Hand: YES",
          `x: ${position.x.toFixed(3)}  y: ${position.y.toFixed(3)}`,
          "Result: AUTO SCROLL · 握拳停止"
        ], now);
        return;
      }

      // 一次手勢完成後短暫冷卻，避免同一個揮動重複觸發
      if (now - lastGestureAt < GESTURE_COOLDOWN_MS) {
        gestureStart = { x: position.x, y: position.y, time: now };
        lastPosition = { ...position };
        const left = Math.max(0, GESTURE_COOLDOWN_MS - (now - lastGestureAt));
        setDebug([
          "Hand: YES",
          `x: ${position.x.toFixed(3)}  y: ${position.y.toFixed(3)}`,
          "Result: 冷卻中",
          `剩餘: ${Math.ceil(left)} ms`
        ], now);
        return;
      }

      // 操作模式中若基準點遺失，直接以目前位置重新抓取，不要求再次握拳。
      if (!gestureStart) {
        gestureStart = { x: position.x, y: position.y, time: now };
        lastPosition = { ...position };
        gestureStatus.textContent = "操作中 · 已重新抓取起點";
        return;
      }

      const elapsed = now - gestureStart.time;

      // 超時只重新抓取目前位置，不解除操作模式。
      if (elapsed > GESTURE_WINDOW_MS) {
        gestureStart = { x: position.x, y: position.y, time: now };
        lastPosition = { ...position };
        gestureStatus.textContent = "操作中 · 已重新抓取起點";
        setDebug([
          "Hand: YES",
          `x: ${position.x.toFixed(3)}  y: ${position.y.toFixed(3)}`,
          "Result: TIMEOUT · 自動更新起點"
        ], now, true);
        return;
      }

      const dx = position.x - gestureStart.x;
      const dy = position.y - gestureStart.y;
      const absX = Math.abs(dx);
      const absY = Math.abs(dy);
      const distance = Math.hypot(dx, dy);
      const speed = distance / Math.max(elapsed, 1);

      let reason = "繼續移動";
      let gesture = null;

      // 上滑：往上移動距離足夠，而且垂直位移要略大於水平位移
      if (dy < -UP_THRESHOLD && absY > absX * DIRECTION_RATIO) {
        gesture = "UP";
        reason = "上滑成立";
      }
      // 左右滑：水平移動距離足夠，而且水平位移要略大於垂直位移
      else if (absX > HORIZONTAL_THRESHOLD && absX > absY * DIRECTION_RATIO) {
        gesture = dx < 0 ? "LEFT" : "RIGHT";
        reason = gesture === "LEFT" ? "左滑成立" : "右滑成立";
      }
      // 速度太慢只做提示，不直接丟掉整段軌跡
      else if (speed < MIN_MOVEMENT_SPEED && elapsed > 300) {
        reason = "移動偏慢，但仍在等待距離";
      }
      else if (absX >= absY) {
        reason = `水平進度 ${Math.min(100, Math.round(absX / HORIZONTAL_THRESHOLD * 100))}%`;
      }
      else if (dy < 0) {
        reason = `上滑進度 ${Math.min(100, Math.round(absY / UP_THRESHOLD * 100))}%`;
      }
      else {
        reason = "目前是往下移動，不觸發";
      }

      setDebug([
        "Hand: YES",
        `x: ${position.x.toFixed(3)}  y: ${position.y.toFixed(3)}`,
        `dx: ${dx.toFixed(3)}  dy: ${dy.toFixed(3)}`,
        `speed: ${speed.toFixed(5)}`,
        `elapsed: ${Math.round(elapsed)} ms`,
        `Result: ${gesture ? "✓" : "·"} ${reason}`
      ], now, Boolean(gesture));

      lastPosition = position;

      if (!gesture) return;

      lastGestureAt = now;
      gestureArmed = true;
      gestureStart = { x: position.x, y: position.y, time: now };
      lastPosition = { ...position };

      if (gesture === "LEFT") startAutoScroll("next");
      if (gesture === "RIGHT") startAutoScroll("previous");
      if (gesture === "UP") flipCard();
    }

    function selectPreferredHand(result, now) {
      const count = result.landmarks?.length || 0;
      if (!count) return null;

      let rightIndex = -1;
      let leftIndex = -1;

      for (let i = 0; i < count; i++) {
        const label = result.handedness?.[i]?.[0]?.categoryName ||
          result.handedness?.[i]?.[0]?.displayName || "Unknown";
        if (label === "Right") rightIndex = i;
        if (label === "Left") leftIndex = i;
      }

      // 右手一出現就立即接管。
      if (rightIndex >= 0) {
        rightHandLastSeenAt = now;
        activeHandLabel = "Right";
        return {
          landmarks: result.landmarks[rightIndex],
          label: "Right"
        };
      }

      // 剛才使用右手時，先保留 500ms，避免兩手同框時控制權來回跳。
      if (activeHandLabel === "Right" && now - rightHandLastSeenAt < RIGHT_HAND_GRACE_MS) {
        return null;
      }

      if (leftIndex >= 0) {
        activeHandLabel = "Left";
        return {
          landmarks: result.landmarks[leftIndex],
          label: "Left"
        };
      }

      // handedness 偶爾缺失時仍保留單手可用性。
      activeHandLabel = "Unknown";
      return {
        landmarks: result.landmarks[0],
        label: "Unknown"
      };
    }

    function detectLoop() {
      if (!detectionStarted || !handLandmarker) return;

      const now = performance.now();

      if (webcam.readyState >= 2) {
        const result = handLandmarker.detectForVideo(
          webcam,
          now
        );

        const selectedHand = selectPreferredHand(result, now);

        if (selectedHand) {
          const hand = selectedHand.landmarks;
          const position = getPalmCenter(hand);
          lastHandSeenAt = now;

          // 起點手勢優先於左右 / 上滑判斷；一次起點只解鎖一次動作。
          if (!handleStartPose(hand, position, now)) {
            processHandMovement(position, now);
          }
        } else {
          // 右手優先保留期間不讓左手立即接管，也不立刻清掉狀態。
          const waitingForRight = activeHandLabel === "Right" &&
            now - rightHandLastSeenAt < RIGHT_HAND_GRACE_MS;

          if (!waitingForRight && now - lastHandSeenAt > HAND_LOST_RESET_MS) {
            if (autoScrollDirection) {
              stopAutoScroll("手離開鏡頭 · 巡卡已停止");
            }
            gestureArmed = false;
            gestureStart = null;
            lastPosition = null;
            startPoseSince = 0;
            startPoseConfirmed = false;
            startPosePoint = null;
            activeHandLabel = null;
            gestureStatus.textContent = "手離開鏡頭 · 請重新握拳";
            setDebug(["Hand: NO", "Result: 手離開超過 1 秒，請重新握拳"], now, true);
          }
        }
      }

      requestAnimationFrame(detectLoop);
    }

    // ==========================================
    // 5. 開始遊戲
    // ==========================================
    async function startGame() {
      startBtn.disabled = true;
      errorBox.style.display = "none";

      // 觸控裝置不要求相機權限，直接進入卡片畫面。
      if (isTouchMode) {
        welcomeScreen.classList.remove("active");
        gameScreen.classList.add("active");
        updateCard();
        cameraText.textContent = "觸控模式";
        gestureStatus.textContent = "左右滑動切換 · 點一下或上滑翻牌";
        controlRow.innerHTML = `
          <span class="control-chip"><b>←</b>左滑 · 下一張</span>
          <span class="control-chip"><b>○</b>點一下 · 翻牌</span>
          <span class="control-chip"><b>→</b>右滑 · 上一張</span>
        `;
        keyboardNote.style.display = "none";
        return;
      }

      startBtn.textContent = "準備中…";

      try {
        if (!handLandmarker) {
          await createHandLandmarker();
        }

        await startCamera();

        welcomeScreen.classList.remove("active");
        gameScreen.classList.add("active");

        updateCard();

        detectionStarted = true;
        requestAnimationFrame(detectLoop);
      } catch (error) {
        console.error(error);

        startBtn.disabled = false;
        startBtn.textContent = "重新嘗試";

        errorBox.style.display = "block";
        errorBox.innerHTML = `
          <strong>無法啟動鏡頭或手勢辨識。</strong><br>
          ${error.message}<br><br>
          請確認：<br>
          1. 已允許瀏覽器使用相機<br>
          2. 使用 localhost 或 HTTPS 開啟網站
        `;
      }
    }

    startBtn.addEventListener("click", startGame);

    gestureToggle.addEventListener("click", async () => {
      if (detectionStarted) {
        stopGestureRecognition();
      } else {
        await startGestureRecognition();
      }
    });

    debugToggle.addEventListener("click", () => {
      const isOpen = debugPanel.classList.toggle("open");
      debugToggle.classList.toggle("active", isOpen);
      debugToggle.setAttribute("aria-expanded", String(isOpen));
    });

    // ==========================================
    // 6. 手機觸控操作
    // 左滑下一張、右滑上一張、上滑或點一下翻牌。
    // ==========================================
    let touchStartPoint = null;
    const TOUCH_SWIPE_THRESHOLD = 46;
    const TOUCH_TAP_DISTANCE = 12;
    const TOUCH_MAX_TIME = 900;

    deckShell.addEventListener("touchstart", (event) => {
      if (!isTouchMode || event.touches.length !== 1) return;
      const touch = event.touches[0];
      touchStartPoint = {
        x: touch.clientX,
        y: touch.clientY,
        time: performance.now()
      };
    }, { passive: true });

    deckShell.addEventListener("touchmove", (event) => {
      if (isTouchMode && touchStartPoint) event.preventDefault();
    }, { passive: false });

    deckShell.addEventListener("touchend", (event) => {
      if (!isTouchMode || !touchStartPoint || event.changedTouches.length !== 1) return;

      const touch = event.changedTouches[0];
      const dx = touch.clientX - touchStartPoint.x;
      const dy = touch.clientY - touchStartPoint.y;
      const absX = Math.abs(dx);
      const absY = Math.abs(dy);
      const elapsed = performance.now() - touchStartPoint.time;
      touchStartPoint = null;

      if (elapsed > TOUCH_MAX_TIME) return;

      if (absX <= TOUCH_TAP_DISTANCE && absY <= TOUCH_TAP_DISTANCE) {
        flipCard();
        return;
      }

      if (dy < -TOUCH_SWIPE_THRESHOLD && absY > absX * 1.15) {
        flipCard();
        return;
      }

      if (absX > TOUCH_SWIPE_THRESHOLD && absX > absY * 1.15) {
        if (dx < 0) nextCard();
        else previousCard();
      }
    }, { passive: true });

    // ==========================================
    // 7. 鍵盤測試
    // 沒鏡頭時可以先測遊戲流程
    // ==========================================
    window.addEventListener("keydown", (event) => {
      if (!gameScreen.classList.contains("active")) return;

      const key = event.key.toLowerCase();

      if (key === "a" || event.key === "ArrowLeft") {
        nextCard();
      }

      if (key === "d" || event.key === "ArrowRight") {
        previousCard();
      }

      if (key === "w" || event.key === "ArrowUp") {
        flipCard();
      }
    });
  </script>
</body>
</html>
