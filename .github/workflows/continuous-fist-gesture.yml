name: Continuous fist gesture mode

on:
  push:
    paths:
      - '.github/workflows/continuous-fist-gesture.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch fist and continuous gesture mode
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_gesture.py
          python /tmp/patch_gesture.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use fist activation with continuous gestures"
          git push
