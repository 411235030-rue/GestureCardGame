name: Add SR card styling

on:
  push:
    paths:
      - '.github/workflows/add-sr-cards.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add SR styling to cards 18 and 20
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old_cards = "    const cards = Array.from({ length: 20 }, (_, i) => ({\n      image: `card/card${i + 1}.jpeg`\n    }));"
          new_cards = "    const cards = Array.from({ length: 20 }, (_, i) => ({\n      image: `card/card${i + 1}.jpeg`,\n      rarity: [18, 20].includes(i + 1) ? \"SR\" : \"R\"\n    }));"
          if old_cards not in text:
            raise SystemExit('cards block not found')
          text = text.replace(old_cards, new_cards, 1)
          css_marker = "    .card.flipped { transform: rotateY(180deg); }"
          sr_css = "    /* ---------- SR cards ---------- */\n    .card.sr .card-face {\n      border-color: #e5bd4f;\n      box-shadow: 0 0 0 1px rgba(255,239,176,.75), 0 0 14px rgba(238,194,73,.48), 0 0 34px rgba(255,215,93,.28), 0 25px 60px rgba(79,56,68,.18);\n      animation: srGoldGlow 1.65s ease-in-out infinite;\n    }\n\n    .card.sr .card-back {\n      background: radial-gradient(circle at 27% 19%, rgba(255,255,255,.42), transparent 27%), radial-gradient(circle at 78% 72%, rgba(255,246,196,.34), transparent 34%), linear-gradient(145deg, #a98228 0%, #d9b94f 34%, #f5dd8c 62%, #b88d2e 100%);\n      color: #fffdf4;\n    }\n\n    .card.sr .card-face::after {\n      content: \"SR\";\n      position: absolute;\n      top: 12px;\n      right: 12px;\n      z-index: 4;\n      min-width: 38px;\n      padding: 6px 9px;\n      border-radius: 999px;\n      text-align: center;\n      font-size: 10px;\n      font-weight: 900;\n      line-height: 1;\n      letter-spacing: .12em;\n      color: #755500;\n      background: linear-gradient(135deg, rgba(255,253,231,.98), rgba(245,210,98,.95));\n      border: 1px solid rgba(255,235,157,.92);\n      box-shadow: 0 0 10px rgba(255,225,121,.52), 0 5px 14px rgba(121,88,8,.18);\n    }\n\n    @keyframes srGoldGlow {\n      0%, 100% {\n        border-color: #d9ad38;\n        box-shadow: 0 0 0 1px rgba(255,239,176,.55), 0 0 9px rgba(238,194,73,.30), 0 0 22px rgba(255,215,93,.18), 0 25px 60px rgba(79,56,68,.18);\n      }\n      50% {\n        border-color: #ffe49a;\n        box-shadow: 0 0 0 1px rgba(255,248,211,.92), 0 0 20px rgba(255,218,101,.72), 0 0 42px rgba(245,190,48,.42), 0 25px 60px rgba(79,56,68,.18);\n      }\n    }\n\n"
          if css_marker not in text:
            raise SystemExit('CSS marker not found')
          text = text.replace(css_marker, sr_css + css_marker, 1)
          class_marker = '      card.className = "card";'
          class_replacement = '      card.className = "card";\n      if (data.rarity === "SR") {\n        card.classList.add("sr");\n      }'
          if class_marker not in text:
            raise SystemExit('card class marker not found')
          text = text.replace(class_marker, class_replacement, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Style cards 18 and 20 as SR"
          git push
