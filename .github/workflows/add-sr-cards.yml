name: Add SR card styling

on:
  push:
    paths:
      - '.github/workflows/add-sr-cards.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add SR styling to cards 18 and 20
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          old_cards = '''    const cards = Array.from({ length: 20 }, (_, i) => ({
      image: `card/card${i + 1}.jpeg`
    }));'''
          new_cards = '''    const cards = Array.from({ length: 20 }, (_, i) => ({
      image: `card/card${i + 1}.jpeg`,
      rarity: [18, 20].includes(i + 1) ? "SR" : "R"
    }));'''
          if old_cards not in text:
            raise SystemExit('cards data block not found')
          text = text.replace(old_cards, new_cards, 1)

          css_marker = '''    .card.flipped { transform: rotateY(180deg); }
    .card.fly-left { transform: translateX(-115vw) rotate(-15deg); opacity: 0; }
    .card.fly-right { transform: translateX(115vw) rotate(15deg); opacity: 0; }'''
          sr_css = '''    /* ---------- SR cards ---------- */
    .card.sr .card-face {
      border-color: #e5bd4f;
      box-shadow:
        0 0 0 1px rgba(255, 239, 176, .75),
        0 0 14px rgba(238, 194, 73, .48),
        0 0 34px rgba(255, 215, 93, .28),
        0 25px 60px rgba(79,56,68,.18);
      animation: srGoldGlow 1.65s ease-in-out infinite;
    }

    .card.sr .card-back {
      background:
        radial-gradient(circle at 27% 19%, rgba(255,255,255,.42), transparent 27%),
        radial-gradient(circle at 78% 72%, rgba(255,246,196,.34), transparent 34%),
        linear-gradient(145deg, #a98228 0%, #d9b94f 34%, #f5dd8c 62%, #b88d2e 100%);
      color: #fffdf4;
    }

    .card.sr .card-face::after {
      content: "SR";
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 4;
      min-width: 38px;
      padding: 6px 9px;
      border-radius: 999px;
      text-align: center;
      font-size: 10px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: .12em;
      color: #755500;
      background: linear-gradient(135deg, rgba(255,253,231,.98), rgba(245,210,98,.95));
      border: 1px solid rgba(255,235,157,.92);
      box-shadow:
        0 0 10px rgba(255,225,121,.52),
        0 5px 14px rgba(121,88,8,.18);
    }

    @keyframes srGoldGlow {
      0%, 100% {
        border-color: #d9ad38;
        box-shadow:
          0 0 0 1px rgba(255,239,176,.55),
          0 0 9px rgba(238,194,73,.30),
          0 0 22px rgba(255,215,93,.18),
          0 25px 60px rgba(79,56,68,.18);
      }
      50% {
        border-color: #ffe49a;
        box-shadow:
          0 0 0 1px rgba(255,248,211,.92),
          0 0 20px rgba(255,218,101,.72),
          0 0 42px rgba(245,190,48,.42),
          0 25px 60px rgba(79,56,68,.18);
      }
    }

    .card.flipped { transform: rotateY(180deg); }
    .card.fly-left { transform: translateX(-115vw) rotate(-15deg); opacity: 0; }
    .card.fly-right { transform: translateX(115vw) rotate(15deg); opacity: 0; }'''
          if css_marker not in text:
            raise SystemExit('card animation CSS marker not found')
          text = text.replace(css_marker, sr_css, 1)

          update_old = '''      // 切到任何卡片時，一律先回到卡背。
      // 例如：2 翻開 → 3 → 回到 2，2 會重新是覆蓋狀態。
      card.className = "card";'''
          update_new = '''      // 切到任何卡片時，一律先回到卡背。
      // 例如：2 翻開 → 3 → 回到 2，2 會重新是覆蓋狀態。
      card.className = "card";
      if (data.rarity === "SR") {
        card.classList.add("sr");
      }'''
          if update_old not in text:
            raise SystemExit('updateCard reset block not found')
          text = text.replace(update_old, update_new, 1)

          flip_old = '''      card.classList.add("flipped");
      gestureStatus.textContent = "↑ 翻牌";'''
          flip_new = '''      card.classList.add("flipped");
      gestureStatus.textContent = cards[currentIndex].rarity === "SR"
        ? "✨ SR GET!"
        : "↑ 翻牌";'''
          if flip_old not in text:
            raise SystemExit('flipCard block not found')
          text = text.replace(flip_old, flip_new, 1)

          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Style cards 18 and 20 as SR"
          git push
