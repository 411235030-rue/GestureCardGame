name: Fix reveal state

on:
  push:
    paths:
      - '.github/workflows/fix-card-flash.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reveal-state rules
        run: python .github/scripts/fix_card_flash.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Keep revealed cards open during the round"
          git push
