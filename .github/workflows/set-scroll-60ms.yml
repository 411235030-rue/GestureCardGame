name: Set 60ms carousel speed

on:
  push:
    paths:
      - '.github/workflows/set-scroll-60ms.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set 60ms card speed
        run: python .github/scripts/set_scroll_60ms.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Test carousel at 60ms per card"
          git push
