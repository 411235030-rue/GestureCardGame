name: Move home cards up
on:
  push:
    paths:
      - .github/workflows/move-home-cards-up.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch CSS
        run: |
          perl -0pi -e 's/(\.hero-art \{.*?place-items: center;)/$1\n      transform: translateY(-35px);/s' index.html
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Move home card stack upward'
          git push