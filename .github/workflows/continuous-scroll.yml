name: Continuous gesture scroll

on:
  push:
    paths:
      - '.github/workflows/continuous-scroll.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch continuous gesture scrolling
        run: python .github/scripts/continuous_scroll_patch.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add continuous gesture card browsing"
          git push
