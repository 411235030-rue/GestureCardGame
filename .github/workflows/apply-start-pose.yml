name: Apply UI v1

on:
  push:
    paths:
      - '.github/workflows/apply-start-pose.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI v1
        shell: bash
        run: |
          python - <<'PY2'
          from pathlib import Path
          import gzip, base64
          data = base64.b64decode("")
          Path("index.html").write_bytes(gzip.decompress(data))
          PY2
      - name: Commit UI
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Redesign welcome and game UI"
          git push
