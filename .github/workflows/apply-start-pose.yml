name: Apply start pose state fix

on:
  push:
    paths:
      - '.github/workflows/apply-start-pose.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add missing start pose state
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'let startPoseSince = 0;' not in s:
              needle = '    let lastPosition = null;\n'
              add = '''    let lastPosition = null;\n\n    // 起點手勢狀態\n    let startPoseSince = 0;\n    let startPoseConfirmed = false;\n    let startPosePoint = null;\n    const START_POSE_HOLD_MS = 300;\n'''
              s = s.replace(needle, add, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Fix start pose state initialization"
            git push
          fi
