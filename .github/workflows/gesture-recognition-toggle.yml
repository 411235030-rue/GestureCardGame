name: Gesture recognition toggle

on:
  push:
    paths:
      - '.github/workflows/gesture-recognition-toggle.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add recognition toggle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          css_old = '''    #cameraDot.on {
      background: #57c98b;
      box-shadow: 0 0 0 5px rgba(87,201,139,.12);
    }
'''
          css_new = '''    #cameraDot.on {
      background: #57c98b;
      box-shadow: 0 0 0 5px rgba(87,201,139,.12);
    }

    .gesture-toggle {
      margin-left: 3px;
      border: 0;
      border-radius: 999px;
      padding: 6px 10px;
      background: rgba(255,255,255,.72);
      color: #82777c;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: background .18s ease, color .18s ease, transform .18s ease;
    }

    .gesture-toggle:hover {
      background: #fff;
      color: #554c51;
      transform: translateY(-1px);
    }

    .gesture-toggle.off {
      background: rgba(221,176,170,.18);
      color: #9d7774;
    }

    .gesture-toggle:disabled {
      opacity: .55;
      cursor: wait;
      transform: none;
    }
'''
          if css_old not in text:
              raise SystemExit('camera dot css block not found')
          text = text.replace(css_old, css_new, 1)

          html_old = '''    <div class="topbar">
      <span id="cameraDot"></span>
      <span id="cameraText">準備鏡頭中</span>
      <span>·</span>
      <span id="cardCounter">1 / 20</span>
    </div>'''
          html_new = '''    <div id="cameraStatusBar" class="topbar">
      <span id="cameraDot"></span>
      <span id="cameraText">準備鏡頭中</span>
      <button id="gestureToggle" class="gesture-toggle" type="button">關閉</button>
    </div>'''
          if html_old not in text:
              raise SystemExit('topbar html block not found')
          text = text.replace(html_old, html_new, 1)

          text = text.replace('    const cardCounter = document.querySelector("#cardCounter");\n', '', 1)

          dom_old = '''    const cameraDot = document.querySelector("#cameraDot");
    const cameraText = document.querySelector("#cameraText");'''
          dom_new = '''    const cameraDot = document.querySelector("#cameraDot");
    const cameraText = document.querySelector("#cameraText");
    const cameraStatusBar = document.querySelector("#cameraStatusBar");
    const gestureToggle = document.querySelector("#gestureToggle");'''
          if dom_old not in text:
              raise SystemExit('camera dom block not found')
          text = text.replace(dom_old, dom_new, 1)

          counter_old = '''      backNumber.textContent = currentIndex + 1;
      cardCounter.textContent =
        `${currentIndex + 1} / ${cards.length}`;

      cardImage.src = data.image;'''
          counter_new = '''      backNumber.textContent = currentIndex + 1;

      cardImage.src = data.image;'''
          if counter_old not in text:
              raise SystemExit('counter update block not found')
          text = text.replace(counter_old, counter_new, 1)

          camera_old = '''      cameraDot.classList.add("on");
      cameraText.textContent = "手勢辨識中";
    }

    // 取手掌中心，會比只追某一根手指穩'''
          camera_new = '''      cameraDot.classList.add("on");
      cameraText.textContent = "手勢辨識中";
    }

    function stopGestureRecognition() {
      detectionStarted = false;

      if (cameraStream) {
        cameraStream.getTracks().forEach((track) => track.stop());
        cameraStream = null;
      }

      webcam.srcObject = null;
      cameraDot.classList.remove("on");
      cameraText.textContent = "手勢辨識已關閉";
      gestureToggle.textContent = "開啟";
      gestureToggle.classList.add("off");
      gestureStatus.textContent = "手勢辨識已關閉";

      gestureArmed = false;
      gestureStart = null;
      lastPosition = null;
      startPoseSince = 0;
      startPoseConfirmed = false;
      startPosePoint = null;
      activeHandLabel = null;
    }

    async function startGestureRecognition() {
      gestureToggle.disabled = true;
      gestureToggle.textContent = "啟動中";

      try {
        if (!handLandmarker) {
          await createHandLandmarker();
        }

        await startCamera();
        detectionStarted = true;
        gestureToggle.textContent = "關閉";
        gestureToggle.classList.remove("off");
        gestureStatus.textContent = "請先握拳啟動操作模式";
        requestAnimationFrame(detectLoop);
      } catch (error) {
        console.error(error);
        cameraDot.classList.remove("on");
        cameraText.textContent = "辨識啟動失敗";
        gestureToggle.textContent = "重試";
        gestureToggle.classList.add("off");
      } finally {
        gestureToggle.disabled = false;
      }
    }

    // 取手掌中心，會比只追某一根手指穩'''
          if camera_old not in text:
              raise SystemExit('startCamera end block not found')
          text = text.replace(camera_old, camera_new, 1)

          touch_old = '''    if (isTouchMode) {
      document.body.classList.add("touch-mode");'''
          touch_new = '''    if (isTouchMode) {
      document.body.classList.add("touch-mode");
      cameraStatusBar.style.display = "none";'''
          if touch_old not in text:
              raise SystemExit('touch mode block not found')
          text = text.replace(touch_old, touch_new, 1)

          listener_old = '''    startBtn.addEventListener("click", startGame);

    debugToggle.addEventListener("click", () => {'''
          listener_new = '''    startBtn.addEventListener("click", startGame);

    gestureToggle.addEventListener("click", async () => {
      if (detectionStarted) {
        stopGestureRecognition();
      } else {
        await startGestureRecognition();
      }
    });

    debugToggle.addEventListener("click", () => {'''
          if listener_old not in text:
              raise SystemExit('listener insertion point not found')
          text = text.replace(listener_old, listener_new, 1)

          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add gesture recognition on off toggle"
          git push
