name: Set ultrafast carousel speed

on:
  push:
    paths:
      - '.github/workflows/set-ultrafast-scroll.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set 30ms card speed
        run: python .github/scripts/set_ultrafast_scroll.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Test carousel at 30ms per card"
          git push
