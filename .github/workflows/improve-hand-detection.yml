name: Improve hand detection

on:
  push:
    paths:
      - '.github/workflows/improve-hand-detection.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch gesture logic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          replacements = [
            ('''    let lastPosition = null;\n\n    // 起點手勢：四指併攏伸直、拇指分開，維持一小段時間後重設起點\n    let startPoseSince = 0;\n    let startPoseConfirmed = false;\n    let startPosePoint = null;\n    const START_POSE_HOLD_MS = 300;''', '''    let lastPosition = null;\n    let gestureArmed = false;\n\n    // 雙手同時出現時固定右手優先，右手短暫離開時先等待，不立刻跳到左手。\n    let activeHandLabel = null;\n    let rightHandLastSeenAt = 0;\n    const RIGHT_HAND_GRACE_MS = 250;\n\n    // 起點手勢：四指併攏伸直、拇指分開，維持一小段時間後重設起點\n    let startPoseSince = 0;\n    let startPoseConfirmed = false;\n    let startPosePoint = null;\n    const START_POSE_HOLD_MS = 220;'''),
            ('numHands: 1,', 'numHands: 2,'),
            ('distance2D(landmarks[tip], wrist) > distance2D(landmarks[pip], wrist) * 1.08', 'distance2D(landmarks[tip], wrist) > distance2D(landmarks[pip], wrist) * 1.05'),
            ('distance2D(landmarks[8], landmarks[12]) < 0.10 &&\n        distance2D(landmarks[12], landmarks[16]) < 0.10 &&\n        distance2D(landmarks[16], landmarks[20]) < 0.11;', 'distance2D(landmarks[8], landmarks[12]) < 0.12 &&\n        distance2D(landmarks[12], landmarks[16]) < 0.12 &&\n        distance2D(landmarks[16], landmarks[20]) < 0.13;'),
            ('distance2D(landmarks[4], landmarks[5]) > 0.11 ||\n        distance2D(landmarks[4], landmarks[8]) > 0.16;', 'distance2D(landmarks[4], landmarks[5]) > 0.10 ||\n        distance2D(landmarks[4], landmarks[8]) > 0.14;'),
            ('startPoseConfirmed = true;\n          gestureStart = null;', 'startPoseConfirmed = true;\n          gestureArmed = false;\n          gestureStart = null;'),
            ('lastPosition = { ...startPosePoint };\n          gestureStatus.textContent = "起點已設定，開始移動";', 'lastPosition = { ...startPosePoint };\n          gestureArmed = true;\n          gestureStatus.textContent = "起點已設定，開始移動";'),
            ('''    function processHandMovement(position, now) {\n      lastHandSeenAt = now;\n\n      // 一次手勢完成後短暫冷卻，避免同一個揮動重複觸發''', '''    function processHandMovement(position, now) {\n      lastHandSeenAt = now;\n\n      // 沒有完成起點手勢就完全禁止滑動，避免自然移動造成誤觸。\n      if (!gestureArmed) {\n        gestureStart = null;\n        lastPosition = null;\n        gestureStatus.textContent = "請先設定起點手勢";\n        setDebug([\n          "Hand: YES",\n          `x: ${position.x.toFixed(3)}  y: ${position.y.toFixed(3)}`,\n          "Result: LOCKED · 請先設定起點"\n        ], now);\n        return;\n      }\n\n      // 一次手勢完成後短暫冷卻，避免同一個揮動重複觸發'''),
            ('''      // 第一次看到手：只建立起點，不立即判斷\n      if (!gestureStart) {\n        gestureStart = { x: position.x, y: position.y, time: now };\n        lastPosition = position;\n        gestureStatus.textContent = "偵測到手 ✓";\n        setDebug([\n          "Hand: YES",\n          `x: ${position.x.toFixed(3)}  y: ${position.y.toFixed(3)}`,\n          "Result: 已建立起點，開始揮動"\n        ], now, true);\n        return;\n      }''', '''      // 已解鎖但尚未有起點時，只採用剛才起點手勢釋放時留下的位置。\n      if (!gestureStart) {\n        gestureArmed = false;\n        gestureStatus.textContent = "請重新設定起點手勢";\n        return;\n      }'''),
            ('''      // 超過時間仍沒有完成手勢，就把目前位置當新起點\n      if (elapsed > GESTURE_WINDOW_MS) {\n        gestureStart = { x: position.x, y: position.y, time: now };\n        lastPosition = position;\n        setDebug([\n          "Hand: YES",\n          `x: ${position.x.toFixed(3)}  y: ${position.y.toFixed(3)}`,\n          "Result: 動作時間超過 1.2 秒，重新取起點"\n        ], now, true);\n        return;\n      }''', '''      // 一次起點只允許一個動作；超時後鎖回去，必須重新設定起點。\n      if (elapsed > GESTURE_WINDOW_MS) {\n        gestureArmed = false;\n        gestureStart = null;\n        lastPosition = null;\n        gestureStatus.textContent = "動作逾時，請重新設定起點";\n        setDebug([\n          "Hand: YES",\n          `x: ${position.x.toFixed(3)}  y: ${position.y.toFixed(3)}`,\n          "Result: TIMEOUT · 請重新設定起點"\n        ], now, true);\n        return;\n      }'''),
            ('lastGestureAt = now;\n      gestureStart = null;', 'lastGestureAt = now;\n      gestureArmed = false;\n      gestureStart = null;'),
          ]

          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'Pattern not found:\n{old[:180]}')
            text = text.replace(old, new, 1)

          marker = '''    function detectLoop() {\n'''
          selector = '''    function selectPreferredHand(result, now) {\n      const count = result.landmarks?.length || 0;\n      if (!count) return null;\n\n      let rightIndex = -1;\n      let leftIndex = -1;\n\n      for (let i = 0; i < count; i++) {\n        const label = result.handedness?.[i]?.[0]?.categoryName ||\n          result.handedness?.[i]?.[0]?.displayName || "Unknown";\n        if (label === "Right") rightIndex = i;\n        if (label === "Left") leftIndex = i;\n      }\n\n      // 右手一出現就立即接管。\n      if (rightIndex >= 0) {\n        rightHandLastSeenAt = now;\n        activeHandLabel = "Right";\n        return {\n          landmarks: result.landmarks[rightIndex],\n          label: "Right"\n        };\n      }\n\n      // 剛才使用右手時，先保留 250ms，避免兩手同框時控制權來回跳。\n      if (activeHandLabel === "Right" && now - rightHandLastSeenAt < RIGHT_HAND_GRACE_MS) {\n        return null;\n      }\n\n      if (leftIndex >= 0) {\n        activeHandLabel = "Left";\n        return {\n          landmarks: result.landmarks[leftIndex],\n          label: "Left"\n        };\n      }\n\n      // handedness 偶爾缺失時仍保留單手可用性。\n      activeHandLabel = "Unknown";\n      return {\n        landmarks: result.landmarks[0],\n        label: "Unknown"\n      };\n    }\n\n'''
          if marker not in text:
            raise SystemExit('detectLoop marker not found')
          text = text.replace(marker, selector + marker, 1)

          old_detect = '''        if (result.landmarks?.length > 0) {\n          const hand = result.landmarks[0];\n          const position = getPalmCenter(hand);\n\n          // 起點手勢優先於左右 / 上滑判斷\n          if (!handleStartPose(hand, position, now)) {\n            processHandMovement(position, now);\n          }\n        } else {\n          // 手離開畫面一小段時間就重設起點\n          if (now - lastHandSeenAt > 250) {\n            gestureStart = null;\n            lastPosition = null;\n            startPoseSince = 0;\n            startPoseConfirmed = false;\n            startPosePoint = null;\n            gestureStatus.textContent = "把手放到鏡頭前";\n            setDebug(["Hand: NO", "Result: 沒偵測到手"], now, true);\n          }\n        }'''
          new_detect = '''        const selectedHand = selectPreferredHand(result, now);\n\n        if (selectedHand) {\n          const hand = selectedHand.landmarks;\n          const position = getPalmCenter(hand);\n          lastHandSeenAt = now;\n\n          // 起點手勢優先於左右 / 上滑判斷；一次起點只解鎖一次動作。\n          if (!handleStartPose(hand, position, now)) {\n            processHandMovement(position, now);\n          }\n        } else {\n          // 右手優先保留期間不讓左手立即接管，也不立刻清掉狀態。\n          const waitingForRight = activeHandLabel === "Right" &&\n            now - rightHandLastSeenAt < RIGHT_HAND_GRACE_MS;\n\n          if (!waitingForRight && now - lastHandSeenAt > 250) {\n            gestureArmed = false;\n            gestureStart = null;\n            lastPosition = null;\n            startPoseSince = 0;\n            startPoseConfirmed = false;\n            startPosePoint = null;\n            activeHandLabel = null;\n            gestureStatus.textContent = "把手放到鏡頭前";\n            setDebug(["Hand: NO", "Result: 沒偵測到可用的手"], now, true);\n          }\n        }'''
          if old_detect not in text:
            raise SystemExit('detectLoop body pattern not found')
          text = text.replace(old_detect, new_detect, 1)

          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Stabilize gesture detection and prefer right hand"
          git push
