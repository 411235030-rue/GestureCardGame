name: Adjust game layout spacing

on:
  push:
    paths:
      - '.github/workflows/adjust-game-layout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix spacing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old_error = '''    .error-box {
      display: none;
      margin-top: 4px;'''
          new_error = '''    .error-box {
      display: none;
      margin-top: 18px;'''
          old_game = '''    .game-main {
      width: 100%;
      display: grid;
      place-items: center;
      margin-top: 18px;
    }'''
          new_game = '''    .game-main {
      width: 100%;
      display: grid;
      place-items: center;
      margin-top: 4px;
    }'''
          if old_error in text:
              text = text.replace(old_error, new_error, 1)
          if old_game in text:
              text = text.replace(old_game, new_game, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fine-tune game layout spacing" || exit 0
          git push