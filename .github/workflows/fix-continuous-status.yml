name: Fix continuous scroll status

on:
  push:
    paths:
      - '.github/workflows/fix-continuous-status.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep gesture off status visible
        run: python .github/scripts/fix_continuous_status.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Keep gesture off status visible"
          git push
