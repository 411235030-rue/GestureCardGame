name: Remove SR badge

on:
  push:
    paths:
      - '.github/workflows/remove-sr-badge.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove SR badge overlay
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          pattern = r'''\n    \.card\.sr \.card-face::after \{.*?\n    \}\n'''
          text, n = re.subn(pattern, '\n', text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('SR badge CSS block not found')

          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove SR badge from rare cards"
          git push
